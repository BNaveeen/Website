             ["#450a0a","#991b1b","#ef4444","#fca5a5"];
  const [dark,mid,accent,light]=pal;

  function fml(title,formula,result){
    return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 224 120">
      <rect width="224" height="120" fill="${dark}"/>
      <rect x="8" y="8" width="208" height="104" fill="${mid}" rx="6" opacity="0.4"/>
      <text x="16" y="23" fill="${light}" font-size="9" font-weight="700" font-family="sans-serif">${title}</text>
      <rect x="12" y="28" width="200" height="26" fill="rgba(0,0,0,0.5)" rx="4"/>
      <text x="20" y="46" fill="${accent}" font-size="10" font-family="monospace">${formula}</text>
      <line x1="12" y1="64" x2="212" y2="64" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <text x="16" y="80" fill="rgba(255,255,255,.45)" font-size="9" font-family="sans-serif">Result:</text>
      <text x="58" y="80" fill="${light}" font-size="11" font-weight="600" font-family="monospace">${result}</text>
      <circle cx="196" cy="95" r="10" fill="${accent}30" stroke="${accent}" stroke-width="1.5"/>
      <text x="196" y="99" text-anchor="middle" fill="${accent}" font-size="11">✓</text>
    </svg>`;
  }

  function bar(title,vals,labs){
    const mx=Math.max(...vals)||1;
    const bw=24,gap=6,ox=12,oy=18,ch=64;
    let b="";
    vals.forEach((v,i)=>{
      const bh=Math.round((v/mx)*ch);
      const x=ox+i*(bw+gap);
      b+=`<rect x="${x}" y="${oy+ch-bh}" width="${bw}" height="${bh}" fill="${accent}" rx="2" opacity="${0.55+i*0.07}"/>`;
      if(labs&&labs[i])b+=`<text x="${x+bw/2}" y="${oy+ch+10}" text-anchor="middle" fill="${light}" font-size="7" font-family="sans-serif">${labs[i]}</text>`;
      b+=`<text x="${x+bw/2}" y="${oy+ch-bh-3}" text-anchor="middle" fill="${accent}" font-size="8" font-family="monospace">${v}</text>`;
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 224 120">
      <rect width="224" height="120" fill="${dark}"/>
      <line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy+ch}" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      <line x1="${ox}" y1="${oy+ch}" x2="212" y2="${oy+ch}" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      <text x="112" y="12" text-anchor="middle" fill="${light}" font-size="9" font-weight="700" font-family="sans-serif">${title}</text>
      ${b}
    </svg>`;
  }

  function line(title,pts){
    const mx=Math.max(...pts),mn=Math.min(...pts);
    const ox=14,oy=18,w=196,h=68;
    const xs=pts.map((_,i)=>ox+Math.round(i*(w/(pts.length-1))));
    const ys=pts.map(v=>oy+h-Math.round(((v-mn)/((mx-mn)||1))*h));
    const path="M"+xs.map((x,i)=>`${x},${ys[i]}`).join("L");
    const area=path+`L${xs[xs.length-1]},${oy+h}L${xs[0]},${oy+h}Z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 224 120">
      <rect width="224" height="120" fill="${dark}"/>
      <text x="112" y="12" text-anchor="middle" fill="${light}" font-size="9" font-weight="700" font-family="sans-serif">${title}</text>
      <path d="${area}" fill="${accent}20"/>
      <path d="${path}" fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round"/>
      ${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="2.5" fill="${accent}"/>`).join("")}
    </svg>`;
  }

  function grid(title,hl){
    const cw=34,rh=15,ox=8,oy=22,cols=6,rows=6;
    let c=`<rect width="224" height="120" fill="${dark}"/>`;

    ["A","B","C","D","E","F"].forEach((h,i)=>{
      c+=`<rect x="${ox+i*cw}" y="${oy}" width="${cw}" height="${rh}" fill="rgba(255,255,255,.08)"/>`;
      c+=`<text x="${ox+i*cw+cw/2}" y="${oy+10}" text-anchor="middle" fill="${accent}" font-size="7" font-weight="700" font-family="sans-serif">${h}</text>`;
    });
    for(let r=1;r<rows;r++){
      for(let cl=0;cl<cols;cl++){
        const isHL=hl&&hl.some(h=>h[0]===r&&h[1]===cl);
        c+=`<rect x="${ox+cl*cw}" y="${oy+r*rh}" width="${cw}" height="${rh}" fill="${isHL?accent+"40":"rgba(255,255,255,.03)"}" stroke="rgba(255,255,255,.06)" stroke-width="0.5"/>`;

    return `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 224 120">${c}</svg>`;
  }

    "Professional Dashboards":[bar("KPI Cards",[92,78,85,91],["Rev","Mgn","Sat","NPS"]),line("Trend",[40,55,50,65,70,68,80]),bar("Region Split",[45,30,25],["East","West","North"])],
    "Office Scripts & Automation":[fml("Record Script","Automate → Record Actions","TypeScript gen"),fml("Run Script","Automate → Run Script","Execute now ✓"),fml("Power Automate","Run on schedule","Email trigger")],
    "Python in Excel":[fml("PY Formula","=PY(\"import pandas as pd...\"","DataFrame out"),fml("xl() Function","xl(\"A1:C100\",headers=True)","→ DataFrame"),fml("matplotlib","plt.bar(df[\"Region\"]...)","Chart output")],
  };
  const fb=[fml(key,"Excel Feature","Click to learn"),bar("Example",[40,60,50,80,70],["","","","",""]),line("Trend",[30,45,40,60,55,70])];
  return M[key]||fb;
}

function buildSB(lv){
  const sb=document.getElementById("sb");sb.innerHTML="";
  const lvs=lv==="all"?C:C.filter(l=>l.lv===lv);
  lvs.forEach(ld=>{ld.sections.forEach(sec=>{
    const w=document.createElement("div");w.className="sb-sec";
    const h=document.createElement("div");h.className="sb-head";
    h.innerHTML=`<span style="color:${ld.c};font-size:7px">●</span>${sec.t}<span class="arr">▼</span>`;
    const items=document.createElement("div");
    sec.i.forEach(item=>{
      const el=document.createElement("div");
      el.className="sb-item"+(activeKey===item?" active":"");
      const isDone=done.has(item);
      el.innerHTML=`<span class="ck" style="color:${isDone?"#22C55E":""}">${isDone?"✓":"○"}</span>${item}`;
      el.onclick=()=>openLesson(item,ld,el);
      items.appendChild(el);
    });
    h.onclick=()=>{const c=items.style.display==="none";items.style.display=c?"":"none";h.classList.toggle("closed",!c);};
    w.appendChild(h);w.appendChild(items);sb.appendChild(w);
  });});
}
function showWelcome(){
  activeKey=null;
  document.getElementById("wp").style.display="";
  document.getElementById("lp").style.display="none";
  document.querySelectorAll(".sb-item").forEach(e=>e.classList.remove("active"));
  const tot=totT(),dn=done.size,pct=Math.round((dn/tot)*100);
  document.getElementById("wp").innerHTML=`
  <div class="welcome">
    <div class="eyebrow">Complete Learning Guide • 80+ Topics</div>
    <h2>Excel Mastery —<br>Zero to Expert</h2>
    <p>Every topic has a full lesson: plain-English explanation, step-by-step guide, formula syntax, a pro tip, and visual examples. All pre-written — instant and free.</p>
    <div class="how-box"><h3>How to use</h3>
      <div class="how-step"><div class="how-num">1</div><p>Use the level tabs at the top to filter topics</p></div>
      <div class="how-step"><div class="how-num">2</div><p>Click any topic in the left sidebar to open its full lesson</p></div>
      <div class="how-step"><div class="how-num">3</div><p>Completed topics are marked ✓ — progress saves automatically</p></div>
    </div>
    <div class="prog" style="max-width:480px">
      <div class="prog-t">Progress: <strong>${dn}/${tot}</strong></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-t"><strong>${pct}%</strong></div>
    </div>
    <div class="stat-row">
      ${C.map(l=>{const t=l.sections.reduce((a,s)=>a+s.i.length,0);const d=l.sections.reduce((a,s)=>a+s.i.filter(i=>done.has(i)).length,0);
      return `<div class="sc" onclick="setLv('${l.lv}',null)"><div class="n" style="color:${l.c}">${d}<span style="font-size:13px;color:var(--mu)">/${t}</span></div><div class="l">${l.label}</div><div class="pp">${Math.round((d/t)*100)}% done</div></div>`;}).join("")}
    </div>
  </div>`;
}
function openLesson(key,ld,el){
  activeKey=key;
  document.querySelectorAll(".sb-item").forEach(e=>e.classList.remove("active"));
  if(el)el.classList.add("active");
  const D=L[key];if(!D)return;
  done.add(key);save();updHP();buildSB(curLv);
  document.getElementById("wp").style.display="none";
  const panel=document.getElementById("lp");panel.style.display="";
  const tot=totT(),dn=done.size,pct=Math.round((dn/tot)*100);
  const lvLabel=D.lv.charAt(0).toUpperCase()+D.lv.slice(1);
  let fHTML="";
  if(D.fm&&D.fm.length){fHTML=`<div class="blk"><div class="bhead">📐 Formula Syntax</div>${D.fm.map(f=>`<div class="fml">${f.s}</div><div class="fmld">${f.d}</div>`).join("")}</div>`;}
  const stHTML=D.steps.map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div><h4>${s.t}</h4><p>${s.d}</p></div></div>`).join("");
  const imgHTML=D.imgs.map((q,i)=>{
    const colors=[["#1e3a5f","#2563eb","#60a5fa"],["#1a3a2a","#16a34a","#4ade80"],["#3b1f1f","#dc2626","#f87171"]];
    const [bg,mid,light]=colors[i%3];
    const icons=["📊","📈","📉","🔢","🗂️","📋","🔍","⚡","🧮","📐"];
    const icon=icons[(q.length+i)%icons.length];
    const words=q.replace(/excel/gi,"").trim().split(" ").slice(0,4).join(" ");
    return `<div class="icard"><div class="iph iph-styled" style="background:linear-gradient(135deg,${bg},${mid});height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.1)"><span style="font-size:28px">${icon}</span><span style="font-size:11px;color:${light};font-weight:600;text-align:center;padding:0 10px;line-height:1.4">${words}</span></div><div class="ilbl">${q}</div></div>`;
  }).join("");
  panel.innerHTML=`
  <div class="lesson">
    <div class="lesson-nav"><div class="back" onclick="showWelcome()">← Overview</div><span class="sep">/</span><span class="crumb">${lvLabel}</span></div>
    <div class="prog"><div class="prog-t">Progress: <strong>${dn}/${tot}</strong></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-t"><strong>${pct}%</strong></div></div>
    <div class="lbadge" style="background:${D.c}18;color:${D.c};border:1px solid ${D.c}35">${lvLabel}</div>
    <div class="lh1">${key}</div>
    <div class="lsub">${D.sub}</div>
    <div class="blk"><div class="bhead">💡 What is this?</div><div class="expl">${D.ex}</div></div>
    <div class="blk"><div class="bhead">🪜 Step-by-step</div><div class="steps">${stHTML}</div></div>
    ${fHTML}
    <div class="blk"><div class="bhead">⚡ Pro tip</div><div class="tip"><span style="font-size:15px;flex-shrink:0">💡</span><p>${D.tip}</p></div></div>
    <div class="blk"><div class="bhead">🖼️ Visual examples</div><div class="igrid">${imgHTML}</div></div>
  </div>`;
}
function setLv(lv,tabEl){
  curLv=lv;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  if(tabEl)tabEl.classList.add("active");
  else{const m={all:0,beginner:1,intermediate:2,advanced:3,expert:4};const ts=document.querySelectorAll(".tab");if(ts[m[lv]])ts[m[lv]].classList.add("active");}
  buildSB(lv);showWelcome();
}
buildSB("all");showWelcome();updHP();
</script>
</body>
