"The Excel Interface":{lv:"beginner",c:"#22C55E",sub:"Navigate Excel's workspace",ex:"Excel's workspace has three zones: the <strong>Ribbon</strong> (toolbar), the <strong>cell grid</strong> (columns A–XFD, rows 1–1,048,576), and the <strong>Formula Bar</strong> (shows/edits cell contents). The <strong>Name Box</strong> shows the active cell address. The <strong>Status Bar</strong> at the bottom shows instant stats.",steps:[{t:"Open a blank workbook",d:"Launch Excel → Blank Workbook. You'll see a grid — columns labeled A, B, C... rows numbered 1, 2, 3..."},{t:"Click a cell",d:"Click B3. The Name Box top-left shows 'B3' and the cell gets a green border — the active cell."},{t:"Explore Ribbon tabs",d:"Click Home, Insert, Formulas, Data, Review, View — each groups related commands."},{t:"Type and confirm",d:"Type 'Hello' in a cell — it appears in both the cell and Formula Bar. Press Enter to confirm."},{t:"Check the Status Bar",d:"Select a range of numbers — Sum, Average, Count appear instantly at the bottom right."}],fm:[],tip:"Ctrl+Home jumps to A1. Ctrl+End jumps to the last used cell. These two save a lot of scrolling.",imgs:["excel spreadsheet interface overview","excel ribbon formula bar","excel name box status bar"]},
"Ribbon & Tabs":{lv:"beginner",c:"#22C55E",sub:"Master Excel's command toolbar",ex:"The <strong>Ribbon</strong> organises all commands into tabs. <strong>Home</strong> is your daily driver — clipboard, font, alignment, number formats. <strong>Insert</strong> adds charts/tables. <strong>Data</strong> has sort/filter/analysis. You can pin favourites to the Quick Access Toolbar.",steps:[{t:"Tour each tab",d:"Click Home, Insert, Page Layout, Formulas, Data, Review, View to see what's available."},{t:"Home tab essentials",d:"Clipboard (copy/paste), Font, Alignment, Number, Styles — covers 80% of daily tasks."},{t:"Quick Access Toolbar",d:"Right-click any button → 'Add to Quick Access Toolbar'. Pins it above the Ribbon permanently."},{t:"Collapse Ribbon",d:"Double-click any tab to hide the Ribbon and gain screen space. Double-click to restore."},{t:"Keyboard navigate",d:"Press Alt — key tips appear on every button so you can reach any command by keyboard."}],fm:[],tip:"Right-click Ribbon → Customize → check 'Developer' to unlock macro recording and form controls.",imgs:["excel ribbon tabs groups","excel quick access toolbar","excel alt key tips keyboard"]},
"Worksheets & Workbooks":{lv:"beginner",c:"#22C55E",sub:"Organise data across sheets and files",ex:"A <strong>Workbook</strong> is the Excel file (.xlsx). Inside are <strong>Worksheets</strong> — the tabs at the bottom. Think of the workbook as a binder and sheets as pages inside. You can reference data across sheets in formulas.",steps:[{t:"Add a sheet",d:"Click + next to the sheet tabs, or press Shift+F11."},{t:"Rename a sheet",d:"Double-click the tab, type a name, press Enter. Keep names short: 'Data', 'Report'."},{t:"Move or copy",d:"Right-click tab → Move or Copy. Check 'Create a copy' to duplicate the sheet."},{t:"Reference another sheet",d:"In a formula, type sheet name then !: =Sheet2!A1 pulls data from A1 on Sheet2."},{t:"Colour tabs",d:"Right-click tab → Tab Color to visually group sheets by purpose."}],fm:[{s:"=Sheet2!A1",d:"Pull value from A1 on Sheet2"},{s:"='Sales Data'!B5",d:"Sheet name with spaces — use single quotes"}],tip:"Ctrl+Page Up / Ctrl+Page Down switches between sheet tabs instantly.",imgs:["excel worksheet tabs bottom","excel multiple sheets workbook","excel sheet tab rename colour"]},
"Cell References":{lv:"beginner",c:"#22C55E",sub:"Relative, absolute and mixed references",ex:"Every cell address is <strong>relative</strong> (A1 — shifts when copied), <strong>absolute</strong> ($A$1 — stays fixed), or <strong>mixed</strong> ($A1 or A$1). This controls whether formulas copy correctly — one of the most important concepts in Excel.",steps:[{t:"Relative reference",d:"In B1 type =A1*2. Copy to B2 — it becomes =A2*2. The reference shifted with the row."},{t:"Absolute reference",d:"Type =A1*$D$1. Copy down — $D$1 stays locked, A1 shifts each row."},{t:"Toggle with F4",d:"Click a reference while editing, press F4: A1 → $A$1 → A$1 → $A1 → A1."},{t:"Lock column only ($A1)",d:"Column fixed, row shifts. Used in lookup tables spanning rows."},{t:"Lock row only (A$1)",d:"Row fixed, column shifts. Used for header rows spanning columns."}],fm:[{s:"=A1*B1",d:"Both references shift when copied"},{s:"=A1*$D$1",d:"D1 locked; A1 shifts"},{s:"=$A1*B$1",d:"Locks column A and row 1"}],tip:"Any single shared constant (tax rate, exchange rate) should always be referenced with $$ signs.",imgs:["excel absolute relative cell reference","excel dollar sign formula reference","excel F4 toggle reference type"]},
"Freeze Panes & Split Views":{lv:"beginner",c:"#22C55E",sub:"Keep headers visible while scrolling",ex:"<strong>Freeze Panes</strong> locks header rows/columns so they stay visible when scrolling large datasets. <strong>Split View</strong> divides the window to view two parts of a sheet at once.",steps:[{t:"Freeze top row",d:"View → Freeze Panes → Freeze Top Row. Row 1 stays pinned as you scroll down."},{t:"Freeze first column",d:"View → Freeze Panes → Freeze First Column. Column A stays visible scrolling right."},{t:"Freeze multiple rows/columns",d:"Click the cell BELOW and RIGHT of freeze point (e.g. B2). View → Freeze Panes → Freeze Panes."},{t:"Unfreeze",d:"View → Freeze Panes → Unfreeze Panes. Removes all freeze settings."},{t:"Split view",d:"Click a cell, View → Split. Drag the split bar to adjust the dividing line."}],fm:[],tip:"A thin blue line on the sheet marks the freeze boundary — if you don't see it, no panes are frozen.",imgs:["excel freeze panes header visible","excel freeze rows columns split","excel split view two panes"]},
"Entering & Editing Data":{lv:"beginner",c:"#22C55E",sub:"Enter data quickly and accurately",ex:"Beyond typing, Excel has smart entry shortcuts. <strong>AutoComplete</strong> suggests existing values. <strong>AutoFill</strong> extends series. <strong>Flash Fill</strong> (Ctrl+E) detects patterns and fills columns automatically. <strong>Ctrl+Enter</strong> fills multiple cells at once.",steps:[{t:"Basic entry",d:"Click cell, type, press Enter (down) or Tab (right). Press Escape to cancel."},{t:"Edit a cell",d:"Press F2 to edit in-place, or click Formula Bar. Use Home/End to navigate within text."},{t:"AutoFill series",d:"Type 1 in A1, 2 in A2, select both, drag the fill handle (small square bottom-right) downward."},{t:"Flash Fill",d:"In B1 type first name from 'John Smith' in A1. Press Ctrl+E — Excel fills all first names."},{t:"Fill many cells at once",d:"Select cells, type a value, press Ctrl+Enter — fills all selected cells simultaneously."}],fm:[],tip:"Right-click the fill handle when dragging: Fill Series, Fill Weekdays, Fill Months, Copy Cells.",imgs:["excel autofill series drag handle","excel flash fill Ctrl+E","excel data entry multiple cells"]},
"AutoFill & Flash Fill":{lv:"beginner",c:"#22C55E",sub:"Fill patterns and series in seconds",ex:"<strong>AutoFill</strong> extends known series — numbers, dates, months, weekdays — by dragging. <strong>Flash Fill</strong> watches what you type in an adjacent column and replicates the pattern for all rows, no formula needed.",steps:[{t:"AutoFill numbers",d:"Type 1 in A1, 2 in A2. Select both, drag fill handle down to generate 3, 4, 5..."},{t:"AutoFill dates",d:"Type a date, drag fill handle. Right-click while dragging to choose: days, months, years, weekdays."},{t:"AutoFill months/weekdays",d:"Type 'Jan' and drag — Excel knows months. Type 'Mon' and drag — knows weekdays."},{t:"Flash Fill — extract",d:"If A has 'Smith, John', type 'John' in B1. Click B2, press Ctrl+E — extracts first names for every row."},{t:"Flash Fill — combine",d:"If A has first names and B has last names, type 'John Smith' in C1. Ctrl+E merges the column."}],fm:[],tip:"If Flash Fill doesn't trigger automatically, press Ctrl+E to force it. Works best when the pattern is consistent.",imgs:["excel autofill drag series","excel flash fill pattern","excel fill months dates weekdays"]},
"Paste Special":{lv:"beginner",c:"#22C55E",sub:"Paste only what you need",ex:"<strong>Paste Special</strong> (Ctrl+Alt+V) lets you paste only values (removing formulas), only formats, transpose rows to columns, or perform arithmetic on pasted data — far more powerful than regular paste.",steps:[{t:"Paste Values only",d:"Copy cells → Ctrl+Alt+V → Values → OK. Pastes results, not formulas."},{t:"Paste Formats only",d:"Ctrl+Alt+V → Formats. Copies all formatting without changing data."},{t:"Transpose",d:"Copy a row → Ctrl+Alt+V → check Transpose → OK. Row becomes a column."},{t:"Paste and multiply",d:"Put 1.1 in a cell, copy it. Select data, Ctrl+Alt+V → Multiply. All selected cells increase by 10%."},{t:"Paste column widths",d:"Ctrl+Alt+V → Column Widths. Copies exact column widths without changing data."}],fm:[],tip:"Right-click destination after copying — hover over Paste Options icons for a live preview before committing.",imgs:["excel paste special dialog","excel paste values only","excel transpose paste special"]},
"Find & Replace":{lv:"beginner",c:"#22C55E",sub:"Search and update data at scale",ex:"<strong>Find</strong> (Ctrl+F) locates values, text, or formulas. <strong>Replace</strong> (Ctrl+H) swaps one value for another across a sheet or entire workbook in one click. Wildcards (* and ?) enable powerful pattern matching.",steps:[{t:"Open Find",d:"Ctrl+F. Type search term, press Enter or Find Next to step through matches."},{t:"Open Replace",d:"Ctrl+H. Enter what to find and what to replace it with."},{t:"Replace All",d:"Click Replace All — swaps every occurrence at once and shows a count of replacements."},{t:"Search entire workbook",d:"Find/Replace → Options → Within: Workbook. Searches every sheet, not just the active one."},{t:"Use wildcards",d:"* matches any sequence (J* finds John, Jane). ? matches exactly one character."}],fm:[],tip:"Use 'Find All' before 'Replace All' to review every match first — prevents accidentally replacing the wrong cells.",imgs:["excel find replace Ctrl+H","excel find replace wildcard","excel replace all workbook"]},
"SUM & AutoSum":{lv:"beginner",c:"#22C55E",sub:"Add up numbers quickly",ex:"<strong>SUM</strong> is the most-used Excel function — it adds all numbers in a range, skipping blanks and text. <strong>AutoSum</strong> (Alt+=) writes the SUM formula automatically by detecting the nearest number range.",steps:[{t:"Type SUM",d:"Click empty cell, type =SUM( drag to select numbers, type ) press Enter."},{t:"AutoSum shortcut",d:"Click cell below data, press Alt+= — Excel guesses the range and inserts =SUM()."},{t:"Non-contiguous ranges",d:"=SUM(A1:A10,C1:C10) adds two separate ranges in one formula."},{t:"AutoSum multiple columns",d:"Select empty cells below several columns, press Alt+=. All get SUM formulas at once."},{t:"Sum entire column",d:"=SUM(A:A) adds all numbers in column A — useful for dynamic tables."}],fm:[{s:"=SUM(A1:A10)",d:"Sum a range"},{s:"=SUM(A1:A10,C1:C10)",d:"Sum two ranges"},{s:"=SUM(A:A)",d:"Sum entire column"}],tip:"Select any range — the Status Bar (bottom right) shows Sum, Average, Count instantly without any formula.",imgs:["excel SUM formula AutoSum","excel Alt equals autosum shortcut","excel SUM multiple ranges"]},
"AVERAGE MIN MAX MEDIAN":{lv:"beginner",c:"#22C55E",sub:"Key summary statistics",ex:"<strong>AVERAGE</strong> returns the mean. <strong>MIN</strong> finds the smallest. <strong>MAX</strong> finds the largest. <strong>MEDIAN</strong> returns the middle value and is unaffected by outliers. All four ignore blank cells automatically.",steps:[{t:"Average",d:"=AVERAGE(B2:B20) — arithmetic mean. Blanks ignored automatically."},{t:"Min / Max",d:"=MIN(B2:B20) smallest value. =MAX(B2:B20) largest value."},{t:"Median",d:"=MEDIAN(B2:B20) — middle value. Use when data has outliers (e.g. salaries, house prices)."},{t:"Summary row",d:"Put SUM, AVERAGE, MIN, MAX in a row below your data for an instant snapshot."},{t:"Average non-zeros",d:"=AVERAGEIF(B2:B20,\"<>0\") averages only non-zero values."}],fm:[{s:"=AVERAGE(B2:B20)",d:"Mean"},{s:"=MIN(B2:B20)",d:"Smallest"},{s:"=MAX(B2:B20)",d:"Largest"},{s:"=MEDIAN(B2:B20)",d:"Middle value"}],tip:"When AVERAGE and MEDIAN differ significantly, outliers are skewing the mean — MEDIAN is usually more representative.",imgs:["excel AVERAGE MIN MAX formula","excel summary statistics row","excel median average comparison"]},
"COUNT COUNTA COUNTBLANK":{lv:"beginner",c:"#22C55E",sub:"Count cells with or without data",ex:"<strong>COUNT</strong> counts only numeric cells. <strong>COUNTA</strong> counts any non-empty cell. <strong>COUNTBLANK</strong> counts empty cells. Together these three cover every data-completeness check.",steps:[{t:"COUNT numbers",d:"=COUNT(A1:A100) counts cells with numbers. Blank and text are skipped."},{t:"COUNTA anything",d:"=COUNTA(A1:A100) counts all non-empty cells — numbers, text, dates, errors."},{t:"COUNTBLANK gaps",d:"=COUNTBLANK(A1:A100) counts empty cells. Use to audit data completeness."},{t:"Count data rows",d:"=COUNTA(A:A)-1 counts data rows dynamically (subtract 1 for the header)."},{t:"Completeness ratio",d:"=1-COUNTBLANK(A2:A100)/COUNTA(A:A) shows fraction of entries that are filled."}],fm:[{s:"=COUNT(A1:A100)",d:"Count numbers"},{s:"=COUNTA(A1:A100)",d:"Count non-empty cells"},{s:"=COUNTBLANK(A1:A100)",d:"Count empty cells"}],tip:"COUNTA is the best way to count rows in a dynamic table — adjusts automatically as you add or remove rows.",imgs:["excel COUNT COUNTA function","excel COUNTBLANK empty audit","excel row count formula"]},
"ROUND ROUNDUP ROUNDDOWN":{lv:"beginner",c:"#22C55E",sub:"Control decimal precision",ex:"<strong>ROUND</strong> rounds to nearest (standard). <strong>ROUNDUP</strong> always rounds away from zero. <strong>ROUNDDOWN</strong> always rounds toward zero. Second argument = decimal places (0=whole, -1=tens, -2=hundreds).",steps:[{t:"Round to 2 decimals",d:"=ROUND(3.14159,2) → 3.14"},{t:"Round to whole number",d:"=ROUND(3.7,0) → 4. =ROUND(3.2,0) → 3."},{t:"Round to tens",d:"=ROUND(1247,-1) → 1250. =ROUND(1247,-2) → 1200."},{t:"ROUNDUP for ceiling",d:"=ROUNDUP(2.1,0) → 3. Always up — good for billing, boxes needed."},{t:"ROUNDDOWN for floor",d:"=ROUNDDOWN(2.9,0) → 2. Always down — good for completed full units."}],fm:[{s:"=ROUND(A1,2)",d:"2 decimal places"},{s:"=ROUNDUP(A1,0)",d:"Round up to whole"},{s:"=ROUNDDOWN(A1,0)",d:"Round down to whole"},{s:"=MROUND(A1,0.25)",d:"Round to nearest 0.25"}],tip:"In financial models always ROUND your results — never rely on cell formatting alone to hide decimals, as they still affect SUM totals.",imgs:["excel ROUND formula decimal","excel ROUNDUP ROUNDDOWN","excel MROUND nearest value"]},
"Number & Date Formats":{lv:"beginner",c:"#22C55E",sub:"Display values the way you need",ex:"Excel stores all numbers as raw values but lets you control how they're <strong>displayed</strong> with formats. 0.25 can show as 25%, $0.25, or just 0. A date can show as 28/05/2026 or May 26 — without changing the underlying data.",steps:[{t:"Open Format Cells",d:"Ctrl+1. Number tab has all formatting categories."},{t:"Currency format",d:"Click $ on Home tab, or Ctrl+1 → Currency. Set decimal places and currency symbol."},{t:"Percentage format",d:"Click % on Home tab. 0.25 → 25% (Excel multiplies by 100 automatically)."},{t:"Custom date format",d:"Ctrl+1 → Custom: dd/mm/yyyy, mmm-yy, or dddd for the full weekday name."},{t:"Custom number format",d:"Ctrl+1 → Custom: #,##0.00 for thousands with 2 decimals. 0.0% for 1-decimal percentage."}],fm:[],tip:"Ctrl+Shift+$ = currency. Ctrl+Shift+% = percentage. Ctrl+Shift+# = date. Ctrl+Shift+! = comma number.",imgs:["excel format cells number dialog","excel currency percentage date format","excel custom format codes"]},
"Cell Formatting & Styles":{lv:"beginner",c:"#22C55E",sub:"Make your data clear and professional",ex:"Cell <strong>formatting</strong> — fill colors, font styles, borders, alignment — makes data easier to read and understand. <strong>Format Painter</strong> copies formatting between cells in one click. <strong>Cell Styles</strong> apply consistent, theme-aware formats.",steps:[{t:"Fill color",d:"Select cells → Home → fill color dropdown. Pick from the palette."},{t:"Borders",d:"Select cells → Home → border dropdown. Choose All Borders, Thick Box, Bottom Only, etc."},{t:"Bold / italic / underline",d:"Ctrl+B bold, Ctrl+I italic, Ctrl+U underline — the three most-used text styles."},{t:"Format Painter",d:"Format one cell perfectly. Click Format Painter (paintbrush). Click other cells to copy the formatting."},{t:"Clear formatting",d:"Home → Clear → Clear Formats. Removes all formatting without deleting data."}],fm:[],tip:"Ctrl+T (Format as Table) gives instant professional formatting with alternating row colors, auto-filter, and auto-expanding formulas.",imgs:["excel fill color border format","excel format painter copy style","excel cell styles table format"]},
"Conditional Formatting":{lv:"beginner",c:"#22C55E",sub:"Automatically highlight data visually",ex:"<strong>Conditional Formatting</strong> automatically colors, bars, or icons cells based on their values — no formulas needed. Instantly highlights outliers, KPI status, or trends in any dataset.",steps:[{t:"Highlight cells > value",d:"Select data → Home → Conditional Formatting → Highlight Cell Rules → Greater Than."},{t:"Color scale",d:"Home → CF → Color Scales. Cells shade from red (low) to green (high) proportionally."},{t:"Data bars",d:"Home → CF → Data Bars. Each cell gets a proportional bar — like a mini bar chart."},{t:"Icon sets",d:"Home → CF → Icon Sets. Add traffic lights, arrows, or stars."},{t:"Formula-based rule",d:"Home → CF → New Rule → 'Use a formula'. E.g. =$C2>100 highlights the whole row."}],fm:[],tip:"Stack multiple rules and use 'Stop If True' so higher-priority rules prevent lower ones from firing.",imgs:["excel conditional formatting color scale","excel data bars icon sets","excel formula based conditional format"]},
"TODAY NOW DATE Functions":{lv:"beginner",c:"#22C55E",sub:"Work with live and calculated dates",ex:"<strong>TODAY()</strong> returns today's date, updating daily. <strong>NOW()</strong> returns date+time. <strong>DATE(y,m,d)</strong> builds a date from parts. <strong>DAY/MONTH/YEAR</strong> extract components from a date.",steps:[{t:"Live date",d:"=TODAY() — updates every day the file is opened."},{t:"Live date+time",d:"=NOW() — recalculates whenever the sheet recalculates."},{t:"Build a date from parts",d:"=DATE(2024,3,15) → 15 March 2024. Useful when year/month/day are in separate columns."},{t:"Extract components",d:"=YEAR(A1), =MONTH(A1), =DAY(A1) pull each part from an existing date."},{t:"First/last of month",d:"=DATE(YEAR(A1),MONTH(A1),1) → first day. =DATE(YEAR(A1),MONTH(A1)+1,0) → last day."}],fm:[{s:"=TODAY()",d:"Today's date"},{s:"=DATE(YEAR(A1),MONTH(A1),1)",d:"First day of A1's month"},{s:"=TEXT(A1,\"dddd\")",d:"Day name (e.g. Monday)"}],tip:"Ctrl+; inserts a static (non-updating) date. TODAY() updates daily — choose based on your need.",imgs:["excel TODAY NOW date function","excel DATE YEAR MONTH DAY","excel date formula first last month"]},
"DATEDIF & Date Math":{lv:"beginner",c:"#22C55E",sub:"Calculate differences between dates",ex:"<strong>DATEDIF</strong> calculates exact differences between dates in years, months, or days. Though undocumented, it works perfectly in all Excel versions. Simple subtraction (=B1-A1) also gives day counts.",steps:[{t:"Age in years",d:"=DATEDIF(B2,TODAY(),\"Y\") where B2 is a birthdate. Returns completed years."},{t:"Months between dates",d:"=DATEDIF(A1,B1,\"M\") gives complete months between two dates."},{t:"Days between dates",d:"=B1-A1 (format result as Number) or =DATEDIF(A1,B1,\"D\")."},{t:"Remaining months after years",d:"=DATEDIF(A1,B1,\"YM\") — months left over after counting complete years."},{t:"Full age string",d:"=DATEDIF(A1,TODAY(),\"Y\")&\" yrs \"&DATEDIF(A1,TODAY(),\"YM\")&\" mths\""}],fm:[{s:"=DATEDIF(A1,B1,\"Y\")",d:"Complete years between dates"},{s:"=DATEDIF(A1,B1,\"YM\")",d:"Remaining months after full years"},{s:"=NETWORKDAYS(A1,B1)",d:"Working days between dates"}],tip:"DATEDIF start date must be earlier than end date — it returns an error if reversed.",imgs:["excel DATEDIF age calculation","excel date difference formula","excel NETWORKDAYS working days"]},
"WEEKDAY WORKDAY EDATE":{lv:"beginner",c:"#22C55E",sub:"Advanced date calculations",ex:"<strong>WEEKDAY</strong> returns the day of the week as a number. <strong>WORKDAY</strong> adds working days to a date. <strong>EDATE</strong> adds whole months. <strong>EOMONTH</strong> returns the last day of a month.",steps:[{t:"Day of week",d:"=WEEKDAY(A1,2) returns 1=Mon through 7=Sun."},{t:"Day name as text",d:"=TEXT(A1,\"dddd\") returns 'Monday', 'Tuesday', etc."},{t:"Add working days",d:"=WORKDAY(A1,10) returns the date 10 working days after A1, skipping weekends."},{t:"Add months",d:"=EDATE(A1,3) adds exactly 3 months. =EDATE(A1,-1) subtracts 1 month."},{t:"End of month",d:"=EOMONTH(A1,0) → last day of A1's month. =EOMONTH(A1,1) → last day of next month."}],fm:[{s:"=WEEKDAY(A1,2)",d:"1=Mon … 7=Sun"},{s:"=WORKDAY(A1,10)",d:"10 working days from A1"},{s:"=EDATE(A1,3)",d:"3 months after A1"},{s:"=EOMONTH(A1,0)",d:"Last day of A1's month"}],tip:"WORKDAY.INTL lets you define custom weekends — useful for regions with non-standard work weeks (e.g. Fri+Sat).",imgs:["excel WEEKDAY day name function","excel WORKDAY EDATE months","excel EOMONTH last day month"]},
"Basic Charts":{lv:"beginner",c:"#22C55E",sub:"Visualise data in one click",ex:"Charts transform numbers into instant visual stories. Excel's <strong>Recommended Charts</strong> analyses your data and suggests the best type. Column, Line, Pie and Bar are the four most common — each suited to different data stories.",steps:[{t:"Select data",d:"Highlight your range including headers. Labels in one column, values in others."},{t:"Insert Recommended Chart",d:"Insert → Charts → Recommended Charts. Excel previews options suited to your data."},{t:"Choose type",d:"Column (compare categories), Line (trends), Pie (proportions), Bar (ranking)."},{t:"Add chart elements",d:"Click + next to chart to add/remove Title, Data Labels, Legend, Gridlines."},{t:"Move and resize",d:"Drag to reposition. Drag corner handles to resize. Right-click → Move Chart for its own sheet."}],fm:[],tip:"Click the paintbrush icon next to a selected chart to quickly browse colour palettes and style presets.",imgs:["excel insert chart recommended","excel bar column line chart","excel chart format design"]},
"Chart Types & Best Practices":{lv:"beginner",c:"#22C55E",sub:"Choose the right chart for your data",ex:"Different data tells different stories. <strong>Column/Bar</strong> for comparisons. <strong>Line</strong> for trends. <strong>Pie</strong> for proportions (max 5 slices). <strong>Scatter</strong> for correlations. <strong>Sparklines</strong> for tiny in-cell trend indicators.",steps:[{t:"Column vs Bar",d:"Column (vertical) for time-based comparisons. Bar (horizontal) for rankings or long labels."},{t:"Line chart for trends",d:"Select date + value columns → Insert → Line. Best for monthly sales, temperatures, stock."},{t:"Pie chart",d:"Use only with 5 or fewer segments. More than 5 → use a bar chart instead."},{t:"Combo chart",d:"Insert → Combo Chart. Mix column + line on secondary axis (e.g. revenue bars + margin % line)."},{t:"Sparklines",d:"Insert → Sparklines → Line. Places a tiny chart inside a single cell for dashboard KPI rows."}],fm:[],tip:"Sort bar chart data largest-to-smallest before charting — ranked bar charts are much easier to read.",imgs:["excel chart types column line pie","excel combo chart secondary axis","excel sparklines cell chart"]},
"Print & Page Setup":{lv:"beginner",c:"#22C55E",sub:"Print spreadsheets professionally",ex:"Excel's print settings control how data appears on paper. <strong>Print Area</strong> defines what prints. <strong>Scale to Fit</strong> shrinks to a page count. <strong>Print Titles</strong> repeats headers on every page. <strong>Headers/Footers</strong> add page numbers.",steps:[{t:"Preview",d:"Ctrl+P or File → Print. The preview shows exactly what will print."},{t:"Set print area",d:"Select range → Page Layout → Print Area → Set Print Area. Only this range prints."},{t:"Fit to page",d:"Page Layout → Scale to Fit → Width: 1 page to force onto a single page width."},{t:"Repeat headers",d:"Page Layout → Print Titles → Rows to repeat at top. Select header row."},{t:"Add page numbers",d:"Insert → Header & Footer. Use preset codes: &[Page] for page number, &[Date] for date."}],fm:[],tip:"Page Layout view (View → Page Layout) shows how the sheet splits across pages while you're still editing.",imgs:["excel print preview page setup","excel print area page breaks","excel headers footers page numbers"]},
"VLOOKUP":{lv:"intermediate",c:"#EAB308",sub:"Search a table and return a matching value",ex:"<strong>VLOOKUP</strong> searches the first column of a table for a value and returns a value from a specified column in the same row. The four arguments: what to find, where to look, which column to return, exact match (always FALSE).",steps:[{t:"Understand the 4 arguments",d:"=VLOOKUP(lookup, table, col_number, FALSE). FALSE = exact match — always include it."},{t:"Write your first VLOOKUP",d:"=VLOOKUP(A2,$F$2:$H$100,2,FALSE) — find A2 in column F, return the 2nd column of the table."},{t:"Lock the table range",d:"Always use $F$2:$H$100 (absolute refs) so the table doesn't shift when copying down."},{t:"Handle #N/A errors",d:"=IFERROR(VLOOKUP(A2,$F$2:$H$100,2,FALSE),\"Not found\") shows friendly text instead of errors."},{t:"Understand the limit",d:"VLOOKUP only looks RIGHT — for left-lookups use XLOOKUP or INDEX+MATCH."}],fm:[{s:"=VLOOKUP(A2,$F$2:$H$100,2,FALSE)",d:"Exact match, return column 2"},{s:"=IFERROR(VLOOKUP(A2,$F:$H,2,FALSE),\"–\")",d:"Suppress #N/A"}],tip:"Forgetting FALSE is the #1 VLOOKUP mistake — without it, Excel does approximate matching and returns wrong results.",imgs:["excel VLOOKUP formula example","excel VLOOKUP table column index","excel VLOOKUP IFERROR"]},
"HLOOKUP":{lv:"intermediate",c:"#EAB308",sub:"Horizontal lookup across row headers",ex:"<strong>HLOOKUP</strong> searches the first row of a table and returns a value from a specified row below. It's the horizontal version of VLOOKUP — less common today since XLOOKUP handles both directions.",steps:[{t:"Structure",d:"=HLOOKUP(lookup, table, row_num, FALSE). Searches top row, returns value from row_num below."},{t:"Write an HLOOKUP",d:"=HLOOKUP(\"Feb\",$B$1:$M$5,3,FALSE) — finds 'Feb' in row 1, returns row 3 value."},{t:"Exact match",d:"Always use FALSE as 4th argument for exact matching."},{t:"Handle errors",d:"Wrap in IFERROR just like VLOOKUP."},{t:"Prefer XLOOKUP",d:"On Excel 365/2021, replace HLOOKUP with XLOOKUP — more flexible and handles both directions."}],fm:[{s:"=HLOOKUP(A1,$B$1:$M$5,3,FALSE)",d:"Find A1 in row 1, return row 3"},{s:"=IFERROR(HLOOKUP(A1,$B$1:$M$5,3,FALSE),0)",d:"Return 0 if not found"}],tip:"HLOOKUP requires lookup values in the TOP row — if headers are in a column, use VLOOKUP or XLOOKUP.",imgs:["excel HLOOKUP horizontal lookup","excel HLOOKUP row table","excel HLOOKUP vs VLOOKUP"]},
"XLOOKUP":{lv:"intermediate",c:"#EAB308",sub:"The modern all-direction lookup",ex:"<strong>XLOOKUP</strong> (Excel 365/2021) replaces both VLOOKUP and HLOOKUP. It looks left or right, has a built-in not-found handler, returns multiple columns at once, and doesn't need column index numbers.",steps:[{t:"Basic XLOOKUP",d:"=XLOOKUP(A2,F:F,G:G) — find A2 in column F, return the corresponding value from G."},{t:"Built-in not-found",d:"=XLOOKUP(A2,F:F,G:G,\"Not found\") — 4th argument shows when no match. No IFERROR needed."},{t:"Look to the left",d:"=XLOOKUP(A2,C:C,A:A) — return column is LEFT of the lookup column. VLOOKUP can't do this."},{t:"Return multiple columns",d:"=XLOOKUP(A2,F:F,G:I) — returns 3 columns that spill automatically."},{t:"Match modes",d:"5th arg: 0=exact, -1=exact or next smaller, 1=exact or next larger, 2=wildcard."}],fm:[{s:"=XLOOKUP(A2,F:F,G:G,\"–\")",d:"Basic XLOOKUP with fallback"},{s:"=XLOOKUP(A2,F:F,G:I,\"–\",0)",d:"Return 3 columns on exact match"}],tip:"On Excel 365, learn XLOOKUP and skip VLOOKUP entirely — it's strictly better in every way.",imgs:["excel XLOOKUP modern lookup","excel XLOOKUP left column return","excel XLOOKUP multiple columns spill"]},
"INDEX & MATCH":{lv:"intermediate",c:"#EAB308",sub:"The most flexible lookup combination",ex:"<strong>INDEX</strong> returns the value at a given position. <strong>MATCH</strong> finds the position of a value. Combined, they perform lookups in any direction with any column as the lookup column — more powerful than VLOOKUP.",steps:[{t:"MATCH alone",d:"=MATCH(\"Apple\",A1:A10,0) returns the row number of 'Apple'. 0 = exact match."},{t:"INDEX alone",d:"=INDEX(B1:B10,3) returns the 3rd value in B1:B10."},{t:"Combine",d:"=INDEX(B1:B10,MATCH(\"Apple\",A1:A10,0)) — MATCH finds the row, INDEX returns from column B."},{t:"Two-way lookup",d:"=INDEX(B2:D10,MATCH(G1,A2:A10,0),MATCH(H1,B1:D1,0)) — look up row and column headers."},{t:"Lock references",d:"=INDEX($B$1:$B$100,MATCH(A2,$A$1:$A$100,0)) — use absolute refs so formulas copy correctly."}],fm:[{s:"=INDEX(B:B,MATCH(A2,A:A,0))",d:"Classic INDEX+MATCH lookup"},{s:"=INDEX(B2:D10,MATCH(G1,A2:A10,0),MATCH(H1,B1:D1,0))",d:"Two-way lookup"}],tip:"INDEX+MATCH doesn't require the lookup column to be first — this flexibility makes it essential for complex workbooks.",imgs:["excel INDEX MATCH formula","excel INDEX MATCH two-way","excel INDEX MATCH vs VLOOKUP"]},
"IF IFS Nested IF":{lv:"intermediate",c:"#EAB308",sub:"Decision-making in formulas",ex:"The <strong>IF</strong> function returns one value if TRUE, another if FALSE. <strong>Nested IFs</strong> chain multiple conditions. <strong>IFS</strong> is cleaner for 3+ conditions — no nesting required.",steps:[{t:"Basic IF",d:"=IF(A1>100,\"Over budget\",\"OK\")"},{t:"Nested IF",d:"=IF(A1>90,\"A\",IF(A1>75,\"B\",IF(A1>60,\"C\",\"Fail\")))"},{t:"Use IFS",d:"=IFS(A1>90,\"A\",A1>75,\"B\",A1>60,\"C\",TRUE,\"Fail\") — cleaner than nested IFs."},{t:"IF with AND",d:"=IF(AND(A1>50,B1>50),\"Both pass\",\"Fail\")"},{t:"IF with OR",d:"=IF(OR(A1>100,B1>100),\"Bonus\",\"Standard\")"}],fm:[{s:"=IF(A1>0,\"Positive\",\"Not positive\")",d:"Basic condition"},{s:"=IFS(A1>90,\"A\",A1>75,\"B\",TRUE,\"C\")",d:"Multiple conditions without nesting"},{s:"=IF(AND(A1>0,B1>0),\"Both positive\",\"No\")",d:"AND condition"}],tip:"Use SWITCH() when testing one cell against a list of exact values — cleaner than a long IFS chain.",imgs:["excel IF function formula","excel nested IF IFS formula","excel IF AND OR logic"]},
"AND OR NOT SWITCH":{lv:"intermediate",c:"#EAB308",sub:"Combine and invert logical tests",ex:"<strong>AND</strong> returns TRUE only if all conditions are true. <strong>OR</strong> returns TRUE if any condition is true. <strong>NOT</strong> inverts a logical value. <strong>SWITCH</strong> maps a single value to multiple outcomes cleanly.",steps:[{t:"AND",d:"=AND(A1>0,B1>0,C1>0) — TRUE only when all three are positive."},{t:"OR",d:"=OR(A1=\"East\",A1=\"West\") — TRUE if A1 is either value."},{t:"NOT",d:"=NOT(A1=\"Closed\") — TRUE when A1 is anything except 'Closed'."},{t:"SWITCH",d:"=SWITCH(A1,1,\"Jan\",2,\"Feb\",3,\"Mar\",\"Other\") — maps numbers to names cleanly."},{t:"Combine",d:"=IF(AND(A1>0,NOT(B1=\"Closed\")),\"Active\",\"Skip\")"}],fm:[{s:"=AND(A1>0,B1>0)",d:"Both positive"},{s:"=OR(A1=\"NY\",A1=\"LA\")",d:"Either city"},{s:"=SWITCH(A1,1,\"Low\",2,\"Med\",3,\"High\",\"?\")",d:"Map values to labels"}],tip:"AND/OR inside SUMPRODUCT formulas can test entire column conditions simultaneously — very powerful for counting.",imgs:["excel AND OR NOT logic","excel SWITCH function values","excel IF AND OR combined"]},
"IFERROR IFNA":{lv:"intermediate",c:"#EAB308",sub:"Handle formula errors gracefully",ex:"<strong>IFERROR</strong> catches any error (#N/A, #VALUE!, #REF!, etc.) and returns a value you specify. <strong>IFNA</strong> only catches #N/A — more precise for lookup functions.",steps:[{t:"IFERROR basics",d:"=IFERROR(your_formula,\"fallback\") — shows the fallback if any error occurs."},{t:"Return blank on error",d:"=IFERROR(VLOOKUP(A2,F:H,2,FALSE),\"\") — empty string looks cleaner than #N/A."},{t:"Return 0 on error",d:"=IFERROR(A1/B1,0) — avoids #DIV/0! when B1 is zero."},{t:"IFNA for lookups",d:"=IFNA(XLOOKUP(A2,F:F,G:G),\"Not found\") — only catches #N/A, lets other errors show."},{t:"Try two sources",d:"=IFERROR(VLOOKUP(A2,Table1,2,0),IFERROR(VLOOKUP(A2,Table2,2,0),\"Missing\"))"}],fm:[{s:"=IFERROR(formula,\"\")",d:"Return blank on any error"},{s:"=IFERROR(A1/B1,0)",d:"Return 0 on division error"},{s:"=IFNA(XLOOKUP(A2,F:F,G:G),\"–\")",d:"Only handle #N/A"}],tip:"Prefer IFNA over IFERROR for lookups — IFERROR can hide genuine formula mistakes like wrong column references.",imgs:["excel IFERROR error handling","excel IFNA VLOOKUP not found","excel error handling formula"]},
"COUNTIF & COUNTIFS":{lv:"intermediate",c:"#EAB308",sub:"Count cells meeting conditions",ex:"<strong>COUNTIF</strong> counts cells matching a single condition. <strong>COUNTIFS</strong> counts cells matching multiple conditions simultaneously. Essential for any categorised counting.",steps:[{t:"COUNTIF basic",d:"=COUNTIF(A:A,\"Apple\") — counts exact text matches."},{t:"COUNTIF comparison",d:"=COUNTIF(B:B,\">500\") — counts values over 500."},{t:"COUNTIF wildcard",d:"=COUNTIF(A:A,\"App*\") — counts cells starting with 'App'."},{t:"COUNTIFS two criteria",d:"=COUNTIFS(A:A,\"East\",B:B,\">500\") — both conditions must match."},{t:"Date range",d:"=COUNTIFS(C:C,\">=\"&D1,C:C,\"<=\"&E1) — count dates between D1 and E1."}],fm:[{s:"=COUNTIF(A:A,\"Apple\")",d:"Count exact matches"},{s:"=COUNTIF(B:B,\">500\")",d:"Count values > 500"},{s:"=COUNTIFS(A:A,\"East\",B:B,\">500\")",d:"Two-condition count"}],tip:"COUNTIF is not case-sensitive. For case-sensitive counting: =SUMPRODUCT((EXACT(A1:A100,\"apple\"))*1).",imgs:["excel COUNTIF criteria formula","excel COUNTIFS multiple conditions","excel COUNTIF wildcard date range"]},
"SUMIF & SUMIFS":{lv:"intermediate",c:"#EAB308",sub:"Sum values meeting conditions",ex:"<strong>SUMIF</strong> sums values where one condition is met. <strong>SUMIFS</strong> sums where multiple conditions are all met. The workhorses of financial reporting.",steps:[{t:"SUMIF basic",d:"=SUMIF(A:A,\"East\",B:B) — for rows where A='East', sum values in B."},{t:"SUMIF comparison",d:"=SUMIF(B:B,\">1000\",C:C) — sum C where B exceeds 1000."},{t:"SUMIF with cell ref",d:"=SUMIF(A:A,E1,B:B) — condition from E1, more flexible than hardcoding."},{t:"SUMIFS two criteria",d:"=SUMIFS(C:C,A:A,\"East\",B:B,\">500\") — sum range is FIRST in SUMIFS."},{t:"Date range",d:"=SUMIFS(C:C,D:D,\">=\"&F1,D:D,\"<=\"&G1) — sum C for dates between F1 and G1."}],fm:[{s:"=SUMIF(A:A,\"East\",B:B)",d:"Sum B where A='East'"},{s:"=SUMIFS(C:C,A:A,\"East\",B:B,\">500\")",d:"Sum C matching two criteria"}],tip:"SUMIFS sum range is the FIRST argument (unlike SUMIF where it's last) — this trips everyone up at least once.",imgs:["excel SUMIF criteria sum","excel SUMIFS multiple conditions","excel SUMIF financial report"]},
"AVERAGEIF & AVERAGEIFS":{lv:"intermediate",c:"#EAB308",sub:"Average values meeting conditions",ex:"<strong>AVERAGEIF</strong> averages values where one condition is met. <strong>AVERAGEIFS</strong> averages where multiple conditions are all met. Syntax mirrors SUMIF/SUMIFS exactly.",steps:[{t:"AVERAGEIF basic",d:"=AVERAGEIF(A:A,\"East\",B:B) — average of B values where A='East'."},{t:"Exclude zeros",d:"=AVERAGEIF(B:B,\"<>0\",B:B) — average only non-zero values."},{t:"AVERAGEIFS two criteria",d:"=AVERAGEIFS(C:C,A:A,\"East\",B:B,\"Q1\") — average C where region=East AND quarter=Q1."},{t:"Exclude blanks",d:"=AVERAGEIF(B:B,\"<>\",B:B) — average non-blank cells only."},{t:"Date range",d:"=AVERAGEIFS(C:C,D:D,\">=\"&F1,D:D,\"<=\"&G1)"}],fm:[{s:"=AVERAGEIF(A:A,\"East\",B:B)",d:"Average B where A='East'"},{s:"=AVERAGEIFS(C:C,A:A,\"East\",B:B,\"Q1\")",d:"Two-condition average"}],tip:"AVERAGEIF ignores blanks automatically but includes zeros — filter them with \">0\" if needed.",imgs:["excel AVERAGEIF formula criteria","excel AVERAGEIFS multiple conditions","excel conditional average analysis"]},
"Text Functions":{lv:"intermediate",c:"#EAB308",sub:"Extract, clean and combine text",ex:"Excel has a full suite of <strong>text functions</strong>. <strong>LEFT/RIGHT/MID</strong> extract parts. <strong>FIND/SEARCH</strong> locate characters. <strong>TRIM</strong> removes spaces. <strong>SUBSTITUTE</strong> replaces text. <strong>TEXTJOIN</strong> combines with a delimiter.",steps:[{t:"Extract parts",d:"=LEFT(A1,3) first 3 chars. =RIGHT(A1,4) last 4 chars. =MID(A1,5,3) 3 chars from position 5."},{t:"Find position",d:"=FIND(\" \",A1) position of first space (case-sensitive). SEARCH is case-insensitive."},{t:"Extract first name",d:"=LEFT(A1,FIND(\" \",A1)-1) — everything before the first space."},{t:"Join with TEXTJOIN",d:"=TEXTJOIN(\", \",TRUE,A1:A10) joins cells with comma-space, skipping blanks."},{t:"Clean with TRIM",d:"=TRIM(SUBSTITUTE(A1,CHAR(160),\" \")) removes regular and non-breaking spaces."}],fm:[{s:"=LEFT(A1,FIND(\" \",A1)-1)",d:"Extract first name"},{s:"=TEXTJOIN(\", \",TRUE,A1:A10)",d:"Join range skipping blanks"},{s:"=PROPER(TRIM(A1))",d:"Capitalise and clean"}],tip:"Chain TRIM(PROPER(SUBSTITUTE())) to clean messy imported name data in one formula.",imgs:["excel LEFT RIGHT MID text","excel TEXTJOIN combine cells","excel TRIM SUBSTITUTE clean data"]},
"TEXT & VALUE Functions":{lv:"intermediate",c:"#EAB308",sub:"Convert between text and numbers",ex:"<strong>TEXT</strong> converts a number or date into formatted text — essential when building strings with dates or currency. <strong>VALUE</strong> converts text-numbers back into real numbers for calculations.",steps:[{t:"Number to formatted text",d:"=TEXT(A1,\"$#,##0.00\") converts 1234.5 into \"$1,234.50\" as a text string."},{t:"Date to formatted text",d:"=TEXT(A1,\"dd mmm yyyy\") turns a date into \"28 May 2026\" as text."},{t:"Embed in a sentence",d:"=\"Report for \"&TEXT(TODAY(),\"dd/mm/yyyy\") — builds a readable string."},{t:"Convert text-numbers",d:"=VALUE(A1) converts \"1,234\" stored as text into the number 1234."},{t:"Quick coerce",d:"=--A1 or =A1*1 quickly converts text-numbers without VALUE()."}],fm:[{s:"=TEXT(A1,\"dd mmm yyyy\")",d:"Date as readable text"},{s:"=TEXT(A1,\"$#,##0\")",d:"Number as currency text"},{s:"=VALUE(A1)",d:"Convert text to number"}],tip:"TEXT() returns a text string — don't use it in arithmetic. Use it only for display or concatenation.",imgs:["excel TEXT function format number","excel TEXT date string","excel VALUE convert text number"]},
"Pivot Tables":{lv:"intermediate",c:"#EAB308",sub:"Summarise large datasets instantly",ex:"A <strong>Pivot Table</strong> summarises thousands of rows into a compact interactive report — no formulas needed. Drag fields to Rows, Columns, Values, and Filters areas. Rearrange and filter in seconds.",steps:[{t:"Prepare data",d:"One header row, no blank rows/columns, consistent data types. An Excel Table (Ctrl+T) is ideal source."},{t:"Insert Pivot Table",d:"Click inside data → Insert → PivotTable → choose location."},{t:"Build the report",d:"Drag: category to Rows, category to Columns, numeric field to Values, filter field to Filters."},{t:"Change calculation",d:"Click Values field → Value Field Settings → change Sum to Count, Average, %, etc."},{t:"Refresh",d:"Right-click → Refresh after source data changes. Or Data → Refresh All."}],fm:[],tip:"Double-click any Pivot Table value cell — Excel creates a new sheet showing all the source rows behind that number.",imgs:["excel pivot table create fields","excel pivot table rows columns","excel pivot table value field settings"]},
"Pivot Table Grouping & Calculated Fields":{lv:"intermediate",c:"#EAB308",sub:"Advanced Pivot Table features",ex:"<strong>Grouping</strong> automatically combines dates into months/quarters/years, or numbers into bands. <strong>Calculated Fields</strong> add formula-based metrics directly inside the Pivot Table.",steps:[{t:"Group dates",d:"Right-click a date field → Group → check Months, Quarters, Years."},{t:"Group numbers",d:"Right-click a number field → Group → set Start, End, and By interval."},{t:"Ungroup",d:"Right-click grouped field → Ungroup."},{t:"Calculated Field",d:"PivotTable Analyze → Fields, Items & Sets → Calculated Field → name and enter formula."},{t:"Show as percentage",d:"Right-click value → Show Values As → % of Grand Total, Running Total, etc."}],fm:[],tip:"Calculated Fields compute on aggregated values, not individual rows — for row-level calculations use a helper column in source data.",imgs:["excel pivot table group dates","excel calculated field pivot","excel show values as percentage"]},
"Slicers & Timelines":{lv:"intermediate",c:"#EAB308",sub:"Visual interactive filters for Pivot Tables",ex:"<strong>Slicers</strong> are visual clickable filter buttons for Pivot Tables. <strong>Timelines</strong> are date-specific slicers with a sliding interface. Both update all connected Pivot Tables simultaneously.",steps:[{t:"Insert slicer",d:"Click Pivot Table → PivotTable Analyze → Insert Slicer → check fields → OK."},{t:"Use slicer",d:"Click button to filter. Ctrl+click for multi-select. Funnel-with-X clears the filter."},{t:"Insert timeline",d:"PivotTable Analyze → Insert Timeline → select date field."},{t:"Connect to multiple Pivots",d:"Right-click slicer → Report Connections → check all Pivot Tables to control."},{t:"Style slicers",d:"Slicer tab → choose a color style to match your dashboard."}],fm:[],tip:"Resize slicers to show all buttons without scrolling — users should never need to scroll a slicer.",imgs:["excel slicer pivot table","excel timeline date filter","excel slicer connect multiple pivots"]},
"Sort & Filter":{lv:"intermediate",c:"#EAB308",sub:"Organise and navigate data quickly",ex:"<strong>Sort</strong> reorders rows by columns. <strong>AutoFilter</strong> (Ctrl+Shift+L) shows only matching rows. Both are non-destructive — data is never deleted, only reordered or hidden.",steps:[{t:"Quick sort",d:"Click a cell in the column → Data → Sort A to Z or Z to A."},{t:"Multi-level sort",d:"Data → Sort → Add Level. Sort by Department first, then by Date within each."},{t:"Enable AutoFilter",d:"Ctrl+Shift+L inside data. Dropdown arrows appear on headers."},{t:"Filter by value",d:"Click dropdown → uncheck 'Select All' → check values you want."},{t:"Filter by condition",d:"Dropdown → Number/Text Filters → Greater Than, Begins With, Top 10, etc."}],fm:[],tip:"After filtering, select visible cells only (Alt+;) before copying — this skips hidden rows.",imgs:["excel sort ascending descending","excel autofilter dropdown","excel filter number text conditions"]},
"Advanced Filter":{lv:"intermediate",c:"#EAB308",sub:"Complex multi-row filter criteria",ex:"<strong>Advanced Filter</strong> enables OR conditions across multiple rows, extracting results to another location, and filtering by formulas — things AutoFilter can't do.",steps:[{t:"Set up criteria range",d:"Copy headers to a blank area. Criteria in same row = AND. Different rows = OR."},{t:"Open Advanced Filter",d:"Data → Sort & Filter → Advanced."},{t:"Configure",d:"List Range = data table. Criteria Range = criteria area. Filter in-place or copy to another location."},{t:"Copy to another location",d:"Select 'Copy to another location' — filtered results appear without disturbing the original."},{t:"Unique records only",d:"Check 'Unique records only' to automatically remove duplicate rows."}],fm:[],tip:"Advanced Filter criteria support wildcards (*) and formulas for above-average or calculated condition filtering.",imgs:["excel advanced filter criteria","excel advanced filter copy location","excel advanced filter OR conditions"]},
"Data Validation":{lv:"intermediate",c:"#EAB308",sub:"Control what can be entered in cells",ex:"<strong>Data Validation</strong> restricts entries to dropdowns, number ranges, or date ranges — keeping data clean. It shows helpful input messages and clear error alerts to guide users.",steps:[{t:"Create a dropdown",d:"Data → Data Validation → Allow: List → Source: type Yes,No,Maybe or select a range."},{t:"Dropdown from table",d:"Source: =TableName[Column] for a structured table reference that auto-updates."},{t:"Number range",d:"Allow: Whole Number → between 1 and 100. Error alert fires for out-of-range entries."},{t:"Input message",d:"Data Validation → Input Message tab. Shows a tooltip when the cell is selected."},{t:"Error alert types",d:"Error Alert → Stop (blocks entry), Warning (warns), Information (note only)."}],fm:[],tip:"Source a dropdown from a named range — expanding the named range automatically updates all dropdowns pointing to it.",imgs:["excel data validation dropdown","excel data validation settings","excel dropdown from named range"]},
"Remove Duplicates & Text to Columns":{lv:"intermediate",c:"#EAB308",sub:"Clean and restructure data",ex:"<strong>Remove Duplicates</strong> deletes duplicate rows. <strong>Text to Columns</strong> splits one column into multiple based on a delimiter (comma, space, tab) or fixed width — essential for cleaning imported data.",steps:[{t:"Remove Duplicates",d:"Select data → Data → Remove Duplicates → choose columns to check → OK."},{t:"Preview first",d:"Excel tells you how many duplicates were found. Work on a copy of data first."},{t:"Text to Columns delimiter",d:"Select column → Data → Text to Columns → Delimited → choose delimiter."},{t:"Text to Columns fixed",d:"Choose Fixed Width → drag break lines for column positions → Finish."},{t:"Convert text dates",d:"Text to Columns with Date format converts text-dates into real Excel dates."}],fm:[],tip:"Text to Columns also converts text-numbers to real numbers — just run it with Finish (no changes) to force recalculation.",imgs:["excel remove duplicates data tab","excel text to columns delimiter","excel split column comma text"]},
"Tables (ListObjects)":{lv:"intermediate",c:"#EAB308",sub:"Structured smart data ranges",ex:"Excel <strong>Tables</strong> (Ctrl+T) auto-expand when data is added, have filtered headers, support structured references, auto-fill formulas, and make Pivot Tables refresh automatically.",steps:[{t:"Create table",d:"Click inside data → Ctrl+T → confirm range and headers → OK."},{t:"Name your table",d:"Table Design → Table Name. Change 'Table1' to 'SalesData'."},{t:"Total row",d:"Table Design → check Total Row. Dropdowns let you choose Sum, Average, Count, etc."},{t:"Structured references",d:"=[@Price]*[@Qty] inside a table — self-documenting formula using column names."},{t:"Reference from outside",d:"=SUM(SalesData[Revenue]) — always sums Revenue column even as rows are added."}],fm:[{s:"=SUM(SalesData[Revenue])",d:"Sum Revenue column of SalesData"},{s:"=[@Price]*[@Qty]",d:"Multiply current row columns"}],tip:"Tables auto-expand when you type in the row below — new data is automatically included in formulas and Pivot Tables.",imgs:["excel table Ctrl+T create","excel structured reference table","excel table total row expand"]},
"FILTER Function":{lv:"advanced",c:"#F97316",sub:"Dynamic row extraction by criteria",ex:"The <strong>FILTER</strong> function (Excel 365+) returns rows matching your criteria as a live spill array. It updates automatically as source data changes — no manual re-filtering needed.",steps:[{t:"Basic FILTER",d:"=FILTER(A2:C100,B2:B100=\"East\") returns all rows where B='East'."},{t:"AND condition",d:"=FILTER(A2:C100,(B2:B100=\"East\")*(C2:C100>500)) — * means AND."},{t:"OR condition",d:"=FILTER(A2:C100,(B2:B100=\"East\")+(B2:B100=\"West\")) — + means OR."},{t:"Fallback",d:"=FILTER(A2:C100,B2:B100=\"East\",\"No data\") — 3rd arg shows when nothing matches."},{t:"Combine with SORT",d:"=SORT(FILTER(A2:C100,B2:B100=\"East\"),3,-1) — filter then sort in one formula."}],fm:[{s:"=FILTER(A2:C100,B2:B100=\"East\")",d:"Rows where B='East'"},{s:"=FILTER(A:C,(B:B=\"East\")*(C:C>500),\"–\")",d:"AND with fallback"}],tip:"FILTER is fully composable — wrap in SORT, UNIQUE, TAKE, or DROP to build multi-step pipelines in one formula.",imgs:["excel FILTER function dynamic","excel FILTER AND OR criteria","excel FILTER SORT combined"]},
"SORT & SORTBY":{lv:"advanced",c:"#F97316",sub:"Sort data dynamically as a formula",ex:"<strong>SORT</strong> returns a sorted copy of a range as a spill array without changing source data. <strong>SORTBY</strong> sorts using a separate array as the key — the key doesn't need to be in the output.",steps:[{t:"Basic SORT",d:"=SORT(A2:C100) sorts by first column ascending. Result spills automatically."},{t:"Sort by column",d:"=SORT(A2:C100,2,1) ascending or =SORT(A2:C100,3,-1) descending."},{t:"Multi-level sort",d:"=SORT(A2:C100,{1,2},{1,-1}) — column 1 ascending then column 2 descending."},{t:"SORTBY",d:"=SORTBY(A2:B100,C2:C100,-1) — sorts A:B using C as key (C not in output)."},{t:"Combine with FILTER+UNIQUE",d:"=SORT(UNIQUE(FILTER(A:A,B:B=\"East\"))) — one formula: filter, deduplicate, sort."}],fm:[{s:"=SORT(A2:C100,3,-1)",d:"Sort by column 3 descending"},{s:"=SORTBY(A2:B100,C2:C100,-1)",d:"Sort using external key"}],tip:"=SORT(UNIQUE(A:A)) produces a sorted deduplicated list — perfect as a dynamic dropdown source.",imgs:["excel SORT function spill","excel SORTBY external key","excel SORT UNIQUE dynamic list"]},
"UNIQUE Function":{lv:"advanced",c:"#F97316",sub:"Extract distinct values dynamically",ex:"<strong>UNIQUE</strong> returns each distinct value from a range once, as a live spill array. It updates automatically when source data changes — replacing the manual Remove Duplicates dialog for reference lists.",steps:[{t:"Unique values",d:"=UNIQUE(A2:A100) returns each distinct value once as a spilled list."},{t:"Unique rows",d:"=UNIQUE(A2:C100) returns unique row combinations across all 3 columns."},{t:"Values appearing exactly once",d:"=UNIQUE(A2:A100,,TRUE) — returns values with no duplicates at all."},{t:"Count unique",d:"=COUNTA(UNIQUE(A2:A100)) counts distinct entries."},{t:"Sorted unique",d:"=SORT(UNIQUE(A2:A100)) — sorted deduplicated list."}],fm:[{s:"=UNIQUE(A2:A100)",d:"Distinct values"},{s:"=SORT(UNIQUE(A2:A100))",d:"Sorted distinct list"},{s:"=COUNTA(UNIQUE(A2:A100))",d:"Count distinct values"}],tip:"Use =SORT(UNIQUE(A:A)) as Data Validation source list — it auto-updates as new values are added.",imgs:["excel UNIQUE function distinct","excel UNIQUE SORT dynamic","excel UNIQUE count distinct"]},
"SEQUENCE & RANDARRAY":{lv:"advanced",c:"#F97316",sub:"Generate number and random arrays",ex:"<strong>SEQUENCE</strong> generates a series of numbers as a spill array. <strong>RANDARRAY</strong> generates random numbers in any grid size. Both are building blocks for dynamic worksheets.",steps:[{t:"Simple sequence",d:"=SEQUENCE(10) generates 1–10 vertically. =SEQUENCE(1,10) generates horizontally."},{t:"Custom start and step",d:"=SEQUENCE(5,1,0,10) generates 0, 10, 20, 30, 40."},{t:"Date series",d:"=SEQUENCE(12,1,DATE(2024,1,1),30) — 12 approximately monthly dates."},{t:"RANDARRAY",d:"=RANDARRAY(5,3) fills 5×3 array with random numbers 0–1."},{t:"Random integers",d:"=RANDARRAY(5,3,1,100,TRUE) fills 5×3 with random integers 1–100."}],fm:[{s:"=SEQUENCE(10)",d:"1 to 10"},{s:"=SEQUENCE(5,1,0,10)",d:"0, 10, 20, 30, 40"},{s:"=RANDARRAY(5,3,1,100,TRUE)",d:"5×3 random integers 1–100"}],tip:"RANDARRAY recalculates on every sheet change. Paste as values (Ctrl+Alt+V → V) to lock in a set.",imgs:["excel SEQUENCE function series","excel RANDARRAY random numbers","excel dynamic array sequence"]},
"LET Function":{lv:"advanced",c:"#F97316",sub:"Name variables inside formulas",ex:"<strong>LET</strong> assigns names to intermediate values inside a formula — making complex formulas readable and faster. Each named value is calculated only once, even if referenced multiple times.",steps:[{t:"Basic LET",d:"=LET(x,A1+B1,x*2) — assign x=A1+B1, then use x in the expression."},{t:"Multiple names",d:"=LET(total,SUM(A:A),count,COUNTA(A:A),total/count) — custom average."},{t:"Readable complex formula",d:"=LET(f,FILTER(A:C,B:B=\"East\"),s,SORT(f,3,-1),TAKE(s,10)) — top 10 East rows."},{t:"Performance gain",d:"If the same expensive sub-calculation appears twice, LET computes it once and reuses it."},{t:"Debug with LET",d:"Change the last argument to any intermediate name to inspect what it contains."}],fm:[{s:"=LET(x,A1+B1,y,C1*D1,x+y)",d:"Named intermediate values"},{s:"=LET(tot,SUM(A:A),avg,AVERAGE(A:A),tot/avg)",d:"Compute once, use twice"}],tip:"LET is the single best upgrade for any formula that references the same expensive calculation more than once.",imgs:["excel LET function variable","excel LET readable formula","excel LET performance"]},
"LAMBDA Function":{lv:"advanced",c:"#F97316",sub:"Create custom reusable functions",ex:"<strong>LAMBDA</strong> lets you define custom functions using worksheet formulas — no VBA. Save them as Named Ranges to use them anywhere like built-in functions.",steps:[{t:"Define LAMBDA",d:"=LAMBDA(a,b,a+b) takes two inputs and returns their sum. Test: =LAMBDA(a,b,a+b)(3,4) → 7."},{t:"Save as named function",d:"Formulas → Name Manager → New. Name: 'AddTax'. Formula: =LAMBDA(price,price*1.2). Now =AddTax(A1) works anywhere."},{t:"Multiple parameters",d:"=LAMBDA(price,rate,price*(1+rate)) — call as =Markup(100,0.15) → 115."},{t:"BYROW",d:"=BYROW(A1:C5,LAMBDA(row,SUM(row))) sums each row individually."},{t:"BYCOL",d:"=BYCOL(A1:C5,LAMBDA(col,AVERAGE(col))) averages each column."}],fm:[{s:"=LAMBDA(x,x^2+2*x+1)",d:"Custom quadratic"},{s:"=BYROW(A1:C5,LAMBDA(r,SUM(r)))",d:"Sum each row"}],tip:"Test your LAMBDA directly in a cell first: =LAMBDA(x,x*2)(5) returns 10 before you save it as a name.",imgs:["excel LAMBDA custom function","excel LAMBDA named range","excel BYROW BYCOL lambda"]},
"Array Formulas (CSE)":{lv:"advanced",c:"#F97316",sub:"Process multiple values simultaneously",ex:"<strong>Array formulas</strong> process entire ranges at once. Older Excel uses Ctrl+Shift+Enter — they appear in {}. Excel 365 handles most arrays natively without CSE through dynamic arrays.",steps:[{t:"Enter CSE formula",d:"Type formula, press Ctrl+Shift+Enter (not just Enter). Curly braces {} appear automatically."},{t:"Count unique (classic)",d:"{=SUM(1/COUNTIF(A2:A100,A2:A100))} counts distinct values without UNIQUE."},{t:"Multi-criteria sum (classic)",d:"{=SUM((A2:A100=\"East\")*(B2:B100>500)*C2:C100)} — old method, SUMIFS is easier now."},{t:"MMULT",d:"=MMULT(A1:C3,E1:G3) multiplies two matrices."},{t:"Modern arrays",d:"In Excel 365, most formulas spill automatically — CSE is rarely needed."}],fm:[{s:"{=SUM(1/COUNTIF(A2:A100,A2:A100))}",d:"Count distinct (legacy)"},{s:"=MMULT(A1:C3,E1:G3)",d:"Matrix multiplication"}],tip:"In Excel 365 you almost never need CSE — dynamic arrays handle spilling automatically.",imgs:["excel array formula CSE curly braces","excel MMULT matrix","excel array formula criteria"]},
"Power Query Basics":{lv:"advanced",c:"#F97316",sub:"Import and transform data automatically",ex:"<strong>Power Query</strong> connects to data sources — Excel files, CSVs, databases, web pages — and cleans/transforms through recorded steps. Every transformation is repeatable with one Refresh click.",steps:[{t:"Open Power Query",d:"Data → Get Data → From File / From Database / From Web."},{t:"Connect to a file",d:"Get Data → From File → From Excel Workbook or CSV. Click Transform Data."},{t:"Apply transformations",d:"Home, Transform, Add Column tabs: remove columns, rename, change types, filter, sort."},{t:"Merge queries",d:"Home → Merge Queries — join two tables like a VLOOKUP on a key column."},{t:"Load to worksheet",d:"Home → Close & Load. Refresh with Data → Refresh All."}],fm:[],tip:"Every step is recorded in 'Applied Steps' panel. Click any step to return to that point — Power Query is fully non-destructive.",imgs:["excel power query editor","excel get data transform steps","excel power query merge refresh"]},
"Power Query Advanced":{lv:"advanced",c:"#F97316",sub:"M language and complex transformations",ex:"Power Query's <strong>M language</strong> is behind every step. Understanding M lets you write custom columns, unpivot data, and automate complex multi-step pipelines.",steps:[{t:"Unpivot columns",d:"Select value columns → Transform → Unpivot Columns. Turns wide data tall."},{t:"Custom column",d:"Add Column → Custom Column → write M formula: e.g. [Price]*[Qty] for revenue."},{t:"Group by",d:"Home → Group By → choose grouping column and aggregation (Sum, Count, Average)."},{t:"Append queries",d:"Home → Append Queries — combine tables vertically (stack sheets on top of each other)."},{t:"Edit M directly",d:"Click any Applied Step — the M formula bar shows the code. Edit to customise."}],fm:[{s:"= Table.AddColumn(prev, \"Revenue\", each [Price]*[Qty])",d:"Custom column in M"}],tip:"Disable 'Load to Worksheet' on intermediate queries — only load your final cleaned output.",imgs:["excel power query M language","excel unpivot columns","excel power query group append"]},
"What-If Analysis":{lv:"advanced",c:"#F97316",sub:"Model scenarios and find target inputs",ex:"<strong>Goal Seek</strong> works backwards from a target. <strong>Data Tables</strong> show all outcomes for a range of inputs. <strong>Scenario Manager</strong> saves and compares named sets of inputs.",steps:[{t:"Goal Seek",d:"Data → What-If Analysis → Goal Seek. Set formula cell to target by changing input cell."},{t:"One-variable Data Table",d:"Inputs down a column, formula beside top input. Data → What-If → Data Table → Column input cell."},{t:"Two-variable Data Table",d:"Inputs in both a row and column. Formula in corner. Data Table → Row and Column input cells."},{t:"Scenario Manager",d:"Data → What-If → Scenario Manager → Add. Save named input sets to compare."},{t:"Scenario Summary",d:"Scenario Manager → Summary. Creates a formatted side-by-side comparison table."}],fm:[],tip:"Data Tables recalculate on every sheet change — set Calculation to Manual (Formulas → Calculation Options) for large tables.",imgs:["excel goal seek what if","excel data table one two variable","excel scenario manager summary"]},
"Solver Add-in":{lv:"advanced",c:"#F97316",sub:"Optimise with multiple constraints",ex:"<strong>Solver</strong> finds input values that maximise, minimise, or hit a target, subject to constraints. Useful for resource allocation, scheduling, and portfolio optimisation problems.",steps:[{t:"Enable Solver",d:"File → Options → Add-ins → Excel Add-ins → check Solver → OK."},{t:"Set objective",d:"Data → Solver → Set Objective: the cell to maximise, minimise, or set to a value."},{t:"Variable cells",d:"'By Changing Variable Cells' — cells Solver can adjust."},{t:"Add constraints",d:"Click Add → cell, operator (<=, >=, =, integer, binary), and limit value."},{t:"Run Solver",d:"Click Solve. Accept the optimal solution or restore original values."}],fm:[],tip:"Use 'Simplex LP' for linear problems. 'GRG Nonlinear' for smooth curves. 'Evolutionary' for integer/complex problems.",imgs:["excel solver add-in optimize","excel solver constraints","excel solver solution result"]},
"Statistical Functions":{lv:"advanced",c:"#F97316",sub:"Analyse distributions and relationships",ex:"Excel has a full statistical library: <strong>STDEV</strong> (standard deviation), <strong>CORREL</strong> (correlation), <strong>PERCENTILE</strong>, <strong>QUARTILE</strong>, <strong>FORECAST</strong>, and <strong>LINEST</strong> for regression analysis.",steps:[{t:"Standard deviation",d:"=STDEV(B2:B100) sample std dev. =STDEVP for population."},{t:"Correlation",d:"=CORREL(A2:A100,B2:B100) — -1 to 1. Near 1 = strong positive correlation."},{t:"Percentiles",d:"=PERCENTILE(B2:B100,0.9) — value at 90th percentile. =QUARTILE(B:B,1) — Q1 (25th percentile)."},{t:"Forecast",d:"=FORECAST.LINEAR(x,known_ys,known_xs) — predicts y for given x using linear regression."},{t:"LINEST",d:"=LINEST(y_range,x_range,TRUE,TRUE) — returns slope, intercept, R², standard error."}],fm:[{s:"=STDEV(B2:B100)",d:"Sample standard deviation"},{s:"=CORREL(A2:A100,B2:B100)",d:"Correlation coefficient"},{s:"=PERCENTILE(B2:B100,0.9)",d:"90th percentile"}],tip:"Add a trendline to a scatter chart (right-click a point → Add Trendline) to visually see regression without formulas.",imgs:["excel STDEV CORREL statistical","excel percentile quartile","excel FORECAST LINEST regression"]},
"Named Ranges & Dynamic Names":{lv:"advanced",c:"#F97316",sub:"Name cells and ranges for cleaner formulas",ex:"<strong>Named Ranges</strong> give cells meaningful names — 'TaxRate' instead of '$B$1'. Formulas become self-documenting. <strong>Dynamic Named Ranges</strong> expand automatically with new data.",steps:[{t:"Create a named range",d:"Select cells → Formulas → Define Name. Or type name in the Name Box and press Enter."},{t:"Use in formulas",d:"=SUM(SalesData) instead of =SUM($B$2:$B$100) — much more readable."},{t:"Manage names",d:"Formulas → Name Manager. View, edit, delete all named ranges."},{t:"Dynamic range",d:"=OFFSET($B$2,0,0,COUNTA($B:$B)-1,1) expands automatically as data is added."},{t:"Table references",d:"=SalesTable[Revenue] is the preferred modern dynamic reference — no OFFSET needed."}],fm:[{s:"=SUM(Revenue)",d:"Sum named range 'Revenue'"},{s:"=OFFSET($B$2,0,0,COUNTA($B:$B)-1,1)",d:"Dynamic expanding range"}],tip:"Scope named ranges to a specific sheet to avoid naming conflicts in multi-sheet workbooks.",imgs:["excel named range define name","excel name manager formulas","excel named range formula"]},
"Advanced Charts":{lv:"advanced",c:"#F97316",sub:"Waterfall, combo, and dynamic charts",ex:"Beyond basic charts: <strong>Combo Charts</strong> mix two types with a secondary axis. <strong>Waterfall Charts</strong> show running totals. <strong>Treemaps</strong> and <strong>Sunburst</strong> visualise hierarchies. Dynamic charts update automatically.",steps:[{t:"Combo chart",d:"Insert → Combo Chart → mix column + line. Set margin % as line on secondary axis."},{t:"Waterfall chart",d:"Insert → Waterfall. Right-click subtotals/totals → Set as Total."},{t:"Treemap / Sunburst",d:"Insert → Hierarchy → Treemap (area) or Sunburst (multi-level pie)."},{t:"Dynamic chart title",d:"Click title → Formula Bar → type =Sheet1!A1 to link to a cell."},{t:"Named range as source",d:"In Select Data dialog, replace range with a named range that expands with data."}],fm:[],tip:"Right-click any chart element → Format — every detail is configurable: axis scales, gap widths, line styles.",imgs:["excel combo chart secondary axis","excel waterfall chart totals","excel treemap sunburst chart"]},
"Protecting Workbooks & Sheets":{lv:"advanced",c:"#F97316",sub:"Control access and editing",ex:"Excel lets you <strong>lock cells</strong> so formulas can't be overwritten, <strong>protect sheets</strong> to allow editing only in specific areas, and <strong>encrypt workbooks</strong> with passwords.",steps:[{t:"Unlock input cells",d:"Select editable cells → Ctrl+1 → Protection tab → uncheck 'Locked'."},{t:"Protect sheet",d:"Review → Protect Sheet → set password → choose allowed actions."},{t:"Unprotect",d:"Review → Unprotect Sheet → enter password."},{t:"Protect workbook structure",d:"Review → Protect Workbook — prevents adding, deleting, or moving sheets."},{t:"Encrypt with password",d:"File → Info → Protect Workbook → Encrypt with Password."}],fm:[],tip:"Ctrl+1 → Protection → 'Hidden' hides formula bar contents even when cells are locked — protects formula IP.",imgs:["excel protect sheet lock cells","excel protect workbook password","excel review protection tab"]},
"VBA Basics":{lv:"expert",c:"#EF4444",sub:"Introduction to Excel automation",ex:"<strong>VBA</strong> (Visual Basic for Applications) is Excel's built-in programming language. The Macro Recorder generates VBA automatically. Manual coding gives full control — automate any action and build complex workflows.",steps:[{t:"Enable Developer tab",d:"File → Options → Customize Ribbon → check Developer → OK."},{t:"Record a macro",d:"Developer → Record Macro → name it → perform actions → Stop Recording."},{t:"Open VBA Editor",d:"Alt+F11. Project tree on left, code modules on right."},{t:"Read recorded code",d:"Developer → Macros → your macro → Edit. Read the generated VBA."},{t:"Run a macro",d:"Developer → Macros → Run. Or press the shortcut key assigned during recording."}],fm:[{s:"Sub HelloWorld()\n  MsgBox \"Hello!\"\nEnd Sub",d:"Minimal VBA procedure"}],tip:"Study generated code in the VBA Editor — recorded code teaches you object/property/method syntax quickly.",imgs:["excel developer tab macro","excel VBA editor module","excel run macro developer"]},
"VBA Variables & Data Types":{lv:"expert",c:"#EF4444",sub:"Store and manage data in code",ex:"<strong>Variables</strong> store data during code execution. Declaring the right <strong>data type</strong> makes code faster and prevents bugs. Key types: Long (integer), Double (decimal), String (text), Boolean (true/false).",steps:[{t:"Declare variables",d:"Dim myName As String, myAge As Long, myScore As Double — declare at top of procedure."},{t:"Assign values",d:"myName = \"Alice\" : myAge = 30 : myScore = 98.5"},{t:"Option Explicit",d:"Add Option Explicit at top of every module — forces variable declaration, catches typos."},{t:"Constants",d:"Const TAX_RATE As Double = 0.2 — for values that never change. Uppercase by convention."},{t:"Object variables",d:"Dim ws As Worksheet : Set ws = Sheets(\"Data\") — use Set to assign object variables."}],fm:[{s:"Dim total As Double\ntotal = Range(\"A1\").Value * 1.2",d:"Declare, assign, compute"},{s:"Const PI As Double = 3.14159",d:"Declare a constant"}],tip:"Always use Long instead of Integer — Long handles larger numbers and is faster on 64-bit Excel.",imgs:["excel VBA variables declare","excel VBA data types","excel VBA option explicit"]},
"VBA Loops":{lv:"expert",c:"#EF4444",sub:"Repeat actions across rows and ranges",ex:"<strong>Loops</strong> are the core of automation — they repeat an action for every row, cell, or item. VBA has three main loops: <strong>For Next</strong> (count-based), <strong>For Each</strong> (collection-based), <strong>Do While</strong> (condition-based).",steps:[{t:"For Next",d:"For i = 1 To 100 : Cells(i,1).Value = i*2 : Next i — writes 2,4...200 into A1:A100."},{t:"For Each",d:"For Each cell In Range(\"A1:A50\") : cell.Value = cell.Value * 1.1 : Next cell — all values +10%."},{t:"Do While",d:"Dim r As Long : r=2 : Do While Cells(r,1).Value<>\"\" : r=r+1 : Loop — finds last row."},{t:"Exit loop early",d:"Exit For or Exit Do to break out when a condition is met."},{t:"Loop through sheets",d:"For Each ws In ThisWorkbook.Worksheets : MsgBox ws.Name : Next ws"}],fm:[{s:"For i=1 To 10\n  Cells(i,1).Value=i\nNext i",d:"Write 1–10 to column A"},{s:"For Each ws In Worksheets\n  ws.Cells.ClearContents\nNext ws",d:"Clear all sheets"}],tip:"Add Application.ScreenUpdating = False before large loops — makes them run dramatically faster.",imgs:["excel VBA for loop","excel VBA for each collection","excel VBA do while loop"]},
"VBA Conditionals & Error Handling":{lv:"expert",c:"#EF4444",sub:"Logic and robust error management",ex:"<strong>If/Then/Else</strong> makes decisions. <strong>Select Case</strong> is cleaner for one variable against many values. <strong>On Error</strong> handles runtime errors gracefully — preventing crashes in production macros.",steps:[{t:"If/Then/Else",d:"If total>100 Then MsgBox \"High\" ElseIf total>50 Then MsgBox \"Med\" Else MsgBox \"Low\" End If"},{t:"Select Case",d:"Select Case region : Case \"East\" : tax=0.1 : Case \"West\" : tax=0.08 : Case Else : tax=0.05 : End Select"},{t:"On Error Resume Next",d:"Ignores errors and continues. Use sparingly — always reset with On Error GoTo 0."},{t:"On Error GoTo",d:"On Error GoTo ErrHandler — jumps to error handler. Add ErrHandler: label at the bottom."},{t:"Error object",d:"Err.Number gives error code. Err.Description gives the message."}],fm:[{s:"If x>0 Then\n  result=\"Pos\"\nElse\n  result=\"Neg\"\nEnd If",d:"If/Then/Else"},{s:"On Error GoTo ErrHandler\n  'risky code\nErrHandler:\n  MsgBox Err.Description",d:"Error handling pattern"}],tip:"Never leave 'On Error Resume Next' active for the whole procedure — scope it tightly around just the line that might error.",imgs:["excel VBA if then else","excel VBA select case","excel VBA error handling"]},
"VBA Working with Ranges":{lv:"expert",c:"#EF4444",sub:"Read and write cells programmatically",ex:"The <strong>Range</strong> and <strong>Cells</strong> objects read and write cell data. Methods like <strong>End</strong>, <strong>Resize</strong>, <strong>Offset</strong>, and <strong>CurrentRegion</strong> make working with dynamic datasets easy.",steps:[{t:"Read a cell",d:"Dim val As Double : val = Range(\"B2\").Value — or Cells(2,2).Value (row, col)."},{t:"Write to a cell",d:"Range(\"C1\").Value = \"Done\" or Cells(1,3).Value = 42"},{t:"Find last row",d:"lastRow = Cells(Rows.Count,1).End(xlUp).Row — finds last filled row in column A."},{t:"Loop with last row",d:"For i=2 To lastRow : Cells(i,3)=Cells(i,1)*Cells(i,2) : Next i"},{t:"CurrentRegion",d:"Range(\"A1\").CurrentRegion selects the contiguous data block around A1."}],fm:[{s:"lastRow = Cells(Rows.Count,1).End(xlUp).Row",d:"Find last used row in column A"},{s:"Range(\"A1\").CurrentRegion.Copy",d:"Copy the contiguous data block"}],tip:"Always find lastRow dynamically — hardcoding row numbers breaks when data grows or shrinks.",imgs:["excel VBA range cells object","excel VBA last row End xlUp","excel VBA loop data rows"]},
"VBA UserForms":{lv:"expert",c:"#EF4444",sub:"Build custom input dialog boxes",ex:"<strong>UserForms</strong> are custom dialog boxes with controls — TextBoxes, ListBoxes, Buttons, CheckBoxes. They give users a clean interface for data entry without touching cells directly.",steps:[{t:"Insert a UserForm",d:"VBA Editor → Insert → UserForm. A blank form and the Toolbox appear."},{t:"Add controls",d:"Drag TextBox, Label, CommandButton from Toolbox. Set Name and Caption in Properties."},{t:"Write button code",d:"Double-click Submit button → write code: Range(\"A1\").Value = TextBox1.Value"},{t:"Show the form",d:"From a module Sub: UserForm1.Show — displays the form. Me.Hide closes it from within."},{t:"Validate input",d:"In click code: If TextBox1.Value = \"\" Then MsgBox \"Required!\" : Exit Sub"}],fm:[{s:"Private Sub btnSubmit_Click()\n  Range(\"A1\").Value = txtName.Value\n  Me.Hide\nEnd Sub",d:"Submit button writes to cell"}],tip:"Set ShowModal = False to allow users to interact with the spreadsheet while the form stays open.",imgs:["excel VBA userform controls","excel VBA textbox button form","excel VBA userform show"]},
"Power Pivot & Data Model":{lv:"expert",c:"#EF4444",sub:"Multi-table analysis without VLOOKUP",ex:"<strong>Power Pivot</strong> loads multiple tables into an in-memory <strong>Data Model</strong> with relationships between them. Pivot Tables built on the model can draw fields from any table — no VLOOKUP columns needed.",steps:[{t:"Load to Data Model",d:"Click inside table → Power Pivot → Add to Data Model. Repeat for each table."},{t:"Open Power Pivot",d:"Power Pivot → Manage. All tables appear as tabs."},{t:"Create relationships",d:"Diagram View → drag CustomerID from one table to matching column in another."},{t:"Build Data Model Pivot Table",d:"Insert → PivotTable → Use this workbook's Data Model. All tables in field list."},{t:"Use cross-table fields",d:"Drag fields from different tables — relationships handle joins automatically."}],fm:[],tip:"Star schema design works best: one fact table (Transactions) surrounded by dimension tables (Customers, Products, Dates).",imgs:["excel power pivot data model","excel power pivot diagram relationships","excel data model pivot cross-table"]},
"DAX Measures":{lv:"expert",c:"#EF4444",sub:"Formula language for the Data Model",ex:"<strong>DAX</strong> is the formula language of Power Pivot. <strong>Measures</strong> calculate dynamically based on Pivot Table filter context. They're different from calculated columns — measures respond to every filter, slicer, and row in the Pivot Table.",steps:[{t:"Create a measure",d:"In Power Pivot → click below column → type in formula bar: Total Sales := SUM(Sales[Amount])"},{t:"Reference measures",d:"Profit Margin := DIVIDE([Gross Profit],[Total Revenue],0)"},{t:"Use CALCULATE",d:"East Sales := CALCULATE([Total Sales],Sales[Region]=\"East\")"},{t:"ALL function",d:"All Sales := CALCULATE([Total Sales],ALL(Sales)) — removes all filters for grand total."},{t:"Time Intelligence",d:"YTD Sales := CALCULATE([Total Sales],DATESYTD('Calendar'[Date]))"}],fm:[{s:"Total Sales := SUM(Sales[Amount])",d:"Basic measure"},{s:"YTD := CALCULATE([Total Sales],DATESYTD('Date'[Date]))",d:"Year to date"}],tip:"Measures evaluate in a filter context set by rows, columns, slicers, and filters — understanding context is the key to DAX.",imgs:["excel DAX measure power pivot","excel CALCULATE DAX filter","excel DAX time intelligence"]},
"DAX CALCULATE & Context":{lv:"expert",c:"#EF4444",sub:"Master filter context modification",ex:"<strong>CALCULATE</strong> is the most important DAX function — it evaluates an expression while modifying filter context. Nearly every useful DAX measure uses CALCULATE to compare, calculate shares, or build time comparisons.",steps:[{t:"Fixed filter override",d:"East Pct := DIVIDE(CALCULATE([Sales],Region[Region]=\"East\"),CALCULATE([Sales],ALL(Region)))"},{t:"Remove all filters",d:"Grand Total := CALCULATE([Sales],ALL(Sales)) — ignores all Pivot Table filters."},{t:"ALLEXCEPT",d:"ALLEXCEPT(Sales,Sales[Region]) removes all filters except Region — useful for subtotals."},{t:"RELATED",d:"=RELATED(Customer[Segment]) in a calculated column — like a VLOOKUP from a related table."},{t:"Same period last year",d:"LY := CALCULATE([Sales],SAMEPERIODLASTYEAR('Date'[Date]))"}],fm:[{s:"Share := DIVIDE([Sales],CALCULATE([Sales],ALL(Sales)))",d:"% of grand total"},{s:"LY Sales := CALCULATE([Sales],SAMEPERIODLASTYEAR('Date'[Date]))",d:"Prior year comparison"}],tip:"Always build a separate Calendar table with every date and relate it — it unlocks all DAX time intelligence functions.",imgs:["excel CALCULATE DAX measure","excel DAX ALL ALLEXCEPT","excel DAX same period last year"]},
"Professional Dashboards":{lv:"expert",c:"#EF4444",sub:"Build interactive executive dashboards",ex:"A professional Excel <strong>dashboard</strong> tells a story at a glance. Great dashboards have clear hierarchy, a consistent palette, minimal clutter, and interactive slicers that let users explore data themselves.",steps:[{t:"Plan the layout",d:"Sketch on paper: KPIs top, charts middle, details bottom. Plan before building."},{t:"Separate data from display",d:"Raw data on hidden sheets. Dashboard sheet = only charts, shapes, summary formulas."},{t:"Consistent color palette",d:"2–3 colors max. One for positives, one for negatives, gray for supporting info."},{t:"Add slicers",d:"Connect slicers to all Pivot Tables so users filter region/period/category with one click."},{t:"Remove clutter",d:"View → uncheck Gridlines and Headings. Set background. Remove chart borders."}],fm:[],tip:"Camera Tool (add via Quick Access Toolbar) creates live linked pictures of any range — perfect for KPI cards.",imgs:["excel dashboard design professional","excel KPI dashboard slicers","excel dashboard clean layout"]},
"Office Scripts & Automation":{lv:"expert",c:"#EF4444",sub:"Modern JavaScript-based automation",ex:"<strong>Office Scripts</strong> is the modern alternative to VBA — it uses TypeScript and runs in Excel for web and desktop. Scripts can be triggered by <strong>Power Automate</strong> to automate workflows without opening Excel manually.",steps:[{t:"Open Automate tab",d:"The Automate tab in Excel (web or desktop) has Record Actions and Code Editor."},{t:"Record actions",d:"Automate → Record Actions → perform steps → Stop. TypeScript script is auto-generated."},{t:"Edit the script",d:"Automate → Code Editor. Edit TypeScript with IntelliSense autocomplete."},{t:"Run manually",d:"Automate → Run → Run Script. Executes on the active workbook."},{t:"Trigger with Power Automate",d:"In Power Automate, use 'Run script' action to trigger on email, schedule, form, etc."}],fm:[{s:"function main(workbook: ExcelScript.Workbook) {\n  let sheet = workbook.getActiveWorksheet();\n  sheet.getRange(\"A1\").setValue(\"Hello\");\n}",d:"Minimal Office Script"}],tip:"Office Scripts run in Excel Online on any OS — unlike VBA which requires the Windows desktop app.",imgs:["excel office scripts automate tab","excel office scripts typescript","excel power automate run script"]},
"Python in Excel":{lv:"expert",c:"#EF4444",sub:"Run Python directly in cells",ex:"<strong>Python in Excel</strong> (Microsoft 365) lets you write Python in cells using =PY(). You get pandas, matplotlib, seaborn, scikit-learn — the full scientific stack without leaving Excel.",steps:[{t:"Write a PY formula",d:"Type =PY( in a cell, write Python code, press Ctrl+Enter. Output spills."},{t:"Reference Excel ranges",d:"Use xl(\"A1:C100\") inside Python to get an Excel range as a pandas DataFrame."},{t:"Create a chart",d:"Use matplotlib or seaborn inside =PY() to generate charts that appear as images."},{t:"Run pandas analysis",d:"import pandas as pd; df=xl(\"SalesTable[#All]\",headers=True); df.groupby(\"Region\").sum()"},{t:"Descriptive statistics",d:"xl(\"A1:C100\",headers=True).describe() returns a full stats table in one formula."}],fm:[{s:"=PY(\"xl('A1:C100',headers=True).describe()\")",d:"Pandas describe() on a range"}],tip:"Python in Excel runs in Microsoft's cloud — data leaves your machine. Check compliance before using with sensitive data.",imgs:["excel python in excel PY formula","excel pandas matplotlib python","excel python in excel chart"]},
};

function getTopicSVGs(key){
