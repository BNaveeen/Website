<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Mastery — Full Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Epilogue:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090D;--sf:#0F1118;--sf2:#161922;--bd:#1F2333;
  --g:#16A34A;--g2:#22C55E;--y:#CA8A04;--y2:#EAB308;
  --o:#C2410C;--o2:#F97316;--r:#B91C1C;--r2:#EF4444;
  --tx:#C8CDD8;--mu:#555E7A;--br:#E8ECF5;
  --hdr-h:52px;--sb-w:240px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{font-family:'Epilogue',sans-serif;background:var(--bg);color:var(--tx);min-height:100%;display:flex;flex-direction:column;}

/* ── HEADER ── */
.hdr{flex-shrink:0;display:flex;align-items:center;border-bottom:1px solid var(--bd);background:var(--sf);height:var(--hdr-h);position:sticky;top:0;z-index:100;}
.hdr-brand{display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid var(--bd);height:100%;flex-shrink:0;}
.hdr-logo{width:26px;height:26px;background:var(--g2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.hdr-title{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--br);white-space:nowrap;}
.hdr-title span{color:var(--g2);}
.tabs{display:flex;height:100%;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:0 14px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:5px;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--br);border-bottom-color:var(--g2);}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.hdr-prog{padding:0 12px;display:flex;align-items:center;gap:8px;border-left:1px solid var(--bd);height:100%;flex-shrink:0;}
.hdr-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--g2);white-space:nowrap;}
.hdr-bar{width:60px;height:3px;background:var(--bd);border-radius:2px;}
.hdr-fill{height:100%;background:var(--g2);border-radius:2px;transition:width .5s;}

/* ── MOBILE MENU TOGGLE ── */
.menu-toggle{display:none;background:none;border:none;color:var(--tx);font-size:18px;padding:0 14px;cursor:pointer;height:100%;align-items:center;-webkit-tap-highlight-color:transparent;}

/* ── BODY LAYOUT ── */
.layout{flex:1;display:flex;position:relative;}

/* ── SIDEBAR ── */
.sb{width:var(--sb-w);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;height:calc(100vh - var(--hdr-h));position:sticky;top:var(--hdr-h);}
.sb::-webkit-scrollbar{width:3px;}
.sb::-webkit-scrollbar-thumb{background:var(--bd);}
.sb-sec{border-bottom:1px solid var(--bd);}
.sb-head{padding:8px 12px;font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--sf2);user-select:none;-webkit-tap-highlight-color:transparent;}
.sb-head:hover{color:var(--tx);}
.sb-head .arr{margin-left:auto;font-size:8px;transition:transform .2s;}
.sb-head.closed .arr{transform:rotate(-90deg);}
.sb-item{padding:8px 12px 8px 20px;font-size:12px;cursor:pointer;color:var(--mu);transition:all .15s;border-left:2px solid transparent;display:flex;align-items:flex-start;gap:6px;line-height:1.4;-webkit-tap-highlight-color:transparent;}
.sb-item:hover{color:var(--tx);background:rgba(255,255,255,.02);}
.sb-item.active{color:var(--br);border-left-color:var(--g2);background:rgba(34,197,94,.07);}
.sb-item .ck{font-size:9px;flex-shrink:0;margin-top:2px;}

/* ── MAIN CONTENT ── */
.main{flex:1;overflow-y:auto;min-width:0;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:var(--bd);}

/* ── WELCOME ── */
.welcome{padding:28px 24px;max-width:680px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--g2);margin-bottom:8px;}
.welcome h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,4vw,28px);color:var(--br);line-height:1.15;margin-bottom:12px;}
.welcome>p{font-size:13px;color:var(--mu);line-height:1.8;margin-bottom:20px;}
.how-box{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:18px;}
.how-box h3{font-size:9px;color:var(--g2);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
.how-step{display:flex;gap:10px;margin-bottom:6px;}
.how-num{width:18px;height:18px;border-radius:50%;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--g2);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.how-step p{font-size:12px;color:var(--mu);line-height:1.6;}
.prog{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.prog-t{font-size:11px;color:var(--mu);}
.prog-t strong{color:var(--g2);font-family:'JetBrains Mono',monospace;}
.prog-track{flex:1;min-width:60px;height:3px;background:var(--bd);border-radius:2px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:2px;transition:width .5s;}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .2s;min-width:90px;-webkit-tap-highlight-color:transparent;}
.sc:hover{border-color:rgba(34,197,94,.3);transform:translateY(-1px);}
.sc .n{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;line-height:1;}
.sc .l{font-size:9px;color:var(--mu);margin-top:3px;text-transform:uppercase;letter-spacing:.8px;}
.sc .pp{font-size:10px;color:var(--mu);margin-top:1px;font-family:'JetBrains Mono',monospace;}

/* ── LESSON ── */
.lesson{padding:24px;max-width:780px;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.lesson-nav{display:flex;align-items:center;gap:6px;margin-bottom:16px;}
.back{font-size:12px;color:var(--mu);cursor:pointer;transition:color .15s;padding:6px 0;-webkit-tap-highlight-color:transparent;}
.back:hover{color:var(--g2);}
.sep{color:var(--bd);}
.crumb{font-size:11px;color:var(--mu);}
.lbadge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:100px;margin-bottom:8px;}
.lh1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(22px,5vw,30px);color:var(--br);line-height:1.1;margin-bottom:5px;}
.lsub{font-size:13px;color:var(--mu);line-height:1.6;margin-bottom:20px;}
.blk{margin-bottom:18px;}
.bhead{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--g2);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.bhead::after{content:'';flex:1;height:1px;background:var(--bd);}
.expl{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--g2);border-radius:8px;padding:14px;font-size:13px;line-height:1.8;color:var(--tx);}
.expl strong{color:var(--g2);}
.steps{display:flex;flex-direction:column;gap:7px;}
.step{display:flex;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px;transition:border-color .2s;}
.step:hover{border-color:rgba(34,197,94,.25);}
.sn{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));color:#000;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step h4{font-size:13px;font-weight:600;color:var(--br);margin-bottom:3px;}
.step p{font-size:12px;color:var(--mu);line-height:1.6;}
.fml{background:#070A10;border:1px solid var(--bd);border-radius:6px;padding:10px 13px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#7DD3FC;overflow-x:auto;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.fmld{font-size:11px;color:var(--mu);margin-bottom:8px;padding-left:2px;}
.tip{background:rgba(202,138,4,.06);border:1px solid rgba(202,138,4,.2);border-radius:8px;padding:12px 13px;display:flex;gap:9px;}
.tip p{font-size:12px;color:#B8922A;line-height:1.6;}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:8px;}
.icard{background:var(--sf);border:1px solid var(--bd);border-radius:7px;overflow:hidden;transition:border-color .2s;}
.icard:hover{border-color:rgba(34,197,94,.25);}
.icard svg{display:block;width:100%;height:auto;}
.icard img{width:100%;height:120px;object-fit:cover;display:block;}
.iph{height:120px;display:flex;align-items:center;justify-content:center;background:var(--sf2);}
.iph span{font-size:11px;color:var(--mu);text-align:center;padding:8px;}
.iph-styled{border-radius:0;}
.ilbl{padding:6px 9px;font-size:10px;color:var(--mu);line-height:1.4;}

/* ── MOBILE OVERLAY for sidebar ── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;transition:opacity .25s;}
.sb-overlay.visible{opacity:1;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}

/* ════════════════════════════════════
   RESPONSIVE BREAKPOINTS
════════════════════════════════════ */

/* Tablet: 601–900px — collapse sidebar to icon drawer */
@media(max-width:900px){
  :root{--sb-w:220px;}
  .hdr-prog{display:none;}
  .lesson,.welcome{padding:20px;}
}

/* Mobile: ≤600px — full responsive layout */
@media(max-width:600px){
  :root{--hdr-h:48px;}
  .hdr-brand{padding:0 12px;}
  .hdr-title{font-size:13px;}
  .menu-toggle{display:flex;}
  .hdr-prog{display:none;}

  /* Sidebar becomes a slide-in drawer */
  .sb{
    position:fixed;
    top:0;left:-100%;
    width:min(280px,85vw);
    height:100%;
    z-index:200;
    transition:left .28s ease;
    padding-top:var(--hdr-h);
    box-shadow:4px 0 24px rgba(0,0,0,.5);
  }
  .sb.open{left:0;}
  .sb-overlay{display:block;}
  .sb-overlay.visible{display:block;}

  /* Main takes full width */
  .layout{flex-direction:column;}
  .main{width:100%;min-height:calc(100vh - var(--hdr-h));}

  /* Content padding */
  .welcome{padding:16px;}
  .lesson{padding:16px;}

  /* Welcome stats — 2 columns */
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sc{min-width:unset;}

  /* Steps full width */
  .step h4{font-size:12px;}
  .step p{font-size:11px;}

  /* Images grid — 1 column on very small screens */
  .igrid{grid-template-columns:1fr 1fr;}

  /* Formula scroll */
  .fml{font-size:11px;}

  /* Tabs — smaller padding */
  .tab{padding:0 10px;font-size:10px;}

  /* Progress bar */
  .prog{flex-wrap:wrap;gap:6px;}
  .prog-track{width:100%;order:3;min-width:unset;}
}

/* Very small phones: ≤380px */
@media(max-width:380px){
  .igrid{grid-template-columns:1fr;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .tab{padding:0 8px;font-size:9px;}
  .hdr-title .full{display:none;}
}

/* Landscape mobile */
@media(max-width:700px) and (orientation:landscape){
  .sb{width:min(240px,60vw);}
  .igrid{grid-template-columns:repeat(3,1fr);}
}

/* Large screens */
@media(min-width:1200px){
  .welcome{padding:36px;}
  .lesson{padding:32px 40px;}
  .igrid{grid-template-columns:repeat(3,1fr);}
}

/* Touch devices — bigger tap targets */
@media(hover:none){
  .sb-item{padding:10px 12px 10px 20px;}
  .tab{padding:0 12px;}
  .back{padding:8px 0;}
}

/* Print */
@media print{
  .hdr,.sb,.sb-overlay,.menu-toggle,.lesson-nav,.prog{display:none!important;}
  .layout{display:block;}
  .main{overflow:visible;}
  .lesson{padding:0;max-width:none;}
  body{background:#fff;color:#000;}
  .expl,.step,.fml,.tip,.icard{border:1px solid #ccc;background:#f9f9f9;color:#000;}
}
</style>
</head>

</div>
